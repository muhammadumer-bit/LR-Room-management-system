<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture Room Control</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b73'/%3E%3Crect x='6' y='9' width='20' height='12' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 25h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f2f5f4;--surface:#fff;--raise:#f8fafa;--ink:#0e2a2e;--mu:#587073;--line:#dbe4e3;--line2:#c9d6d5;
  --brand:#0b6b73;--brand-h:#085a61;--brand-soft:#dcefef;--on-brand:#fff;
  --live:#17895c;--live-soft:#ddf3e8;--amber:#a85f00;--amber-soft:#fdefd3;--danger:#b8342a;--danger-soft:#fbe4e1;--off:#6b7d80;--off-soft:#e9eeee;
  --stage:#071b1e;--stage-ink:#e6f4f3;--stage-mu:#8fb0b1;
  --sh:0 1px 2px rgba(10,40,44,.06),0 8px 24px -12px rgba(10,40,44,.14);
  --ff:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fd:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#091a1d;--surface:#102529;--raise:#142d32;--ink:#e5f2f1;--mu:#92adae;--line:#1f3a3f;--line2:#2b4a50;
  --brand:#3fb7bf;--brand-h:#5cc8cf;--brand-soft:#123a40;--on-brand:#04191b;
  --live:#4cc995;--live-soft:#0f3a2b;--amber:#f0b04a;--amber-soft:#3a2d10;--danger:#ff8a80;--danger-soft:#40201d;--off:#97aaac;--off-soft:#1a3236;--sh:none}}
:root[data-theme=dark]{
  --paper:#091a1d;--surface:#102529;--raise:#142d32;--ink:#e5f2f1;--mu:#92adae;--line:#1f3a3f;--line2:#2b4a50;
  --brand:#3fb7bf;--brand-h:#5cc8cf;--brand-soft:#123a40;--on-brand:#04191b;
  --live:#4cc995;--live-soft:#0f3a2b;--amber:#f0b04a;--amber-soft:#3a2d10;--danger:#ff8a80;--danger-soft:#40201d;--off:#97aaac;--off-soft:#1a3236;--sh:none}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--ff);-webkit-font-smoothing:antialiased}
body.nav-lock{overflow:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--fd);font-weight:650;letter-spacing:-.012em}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mu{color:var(--mu)}.sm{font-size:12.5px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:550;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;white-space:nowrap}
.btn:hover{border-color:var(--brand);background:var(--raise)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-h);border-color:var(--brand-h)}
.btn.dng{color:var(--danger)}.btn.dng:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn.dng-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--brand-soft);border-color:transparent}
.btn.s{min-height:30px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.icon{padding:0;width:36px}
input[type=text],input[type=password],input:not([type]),select,textarea{width:100%;min-height:38px;padding:8px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);min-width:0}
textarea{resize:vertical;font:inherit;display:block}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:2px solid var(--brand-soft);outline-offset:0}
.fld{display:block;margin-top:14px}.fld>span{display:block;font-weight:550;margin-bottom:5px;font-size:13px}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.inline>*{flex:1 1 150px}.inline>.btn{flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px 2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{background:var(--live-soft);color:var(--live)}.pill.ready{background:var(--brand-soft);color:var(--brand)}
.pill.help{background:var(--amber-soft);color:var(--amber)}.pill.off{background:var(--off-soft);color:var(--off)}.pill.busy{background:var(--danger-soft);color:var(--danger)}
.pill.live::before{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.card.p{padding:20px}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card>header h3{font-size:15px}
.stack>*+*{margin-top:16px}
.empty{padding:36px 20px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--mu);padding:10px 20px;border-bottom:1px solid var(--line);background:var(--raise)}
td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- sign-in ---------- */
.gate{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.9fr)}
.stage{position:relative;color:var(--stage-ink);padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;isolation:isolate;
  background:linear-gradient(145deg,#052022 0%,#0a353a 42%,#0b6b73 100%)}
.stage-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;animation:gateIn .9s ease both}
.stage-veil{position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(105deg,rgba(4,22,24,.55) 0%,rgba(4,22,24,.28) 45%,rgba(4,22,24,.72) 100%),linear-gradient(to top,rgba(4,18,20,.82) 0%,rgba(4,18,20,.15) 42%,rgba(4,18,20,.35) 100%)}
.stage.has-photo .stage-veil{background:linear-gradient(105deg,rgba(4,22,24,.42) 0%,rgba(4,22,24,.18) 48%,rgba(4,22,24,.7) 100%),linear-gradient(to top,rgba(4,18,20,.88) 0%,rgba(4,18,20,.2) 48%,transparent 100%)}
.stage-copy{position:relative;z-index:2;max-width:560px;animation:gateUp .7s .12s ease both}
.stage-logo{display:block;width:min(148px,28vw);height:auto;max-height:148px;object-fit:contain;filter:drop-shadow(0 10px 28px rgba(0,0,0,.35));margin-bottom:22px}
.stage-mark{width:88px;height:88px;border-radius:22px;background:rgba(63,183,191,.95);color:#04191b;display:grid;place-items:center;margin-bottom:22px;box-shadow:0 16px 40px -18px #000}
.stage-mark svg{width:40px;height:40px}
.stage-name{font-family:var(--fd);font-weight:700;font-size:clamp(34px,5.2vw,54px);line-height:1.05;letter-spacing:-.03em;margin:0 0 12px;text-wrap:balance}
.stage-lead{margin:0;max-width:34ch;font-size:clamp(15px,1.7vw,18px);line-height:1.45;color:rgba(230,244,243,.88)}
.stage-room{position:relative;z-index:2;margin-top:clamp(28px,5vh,48px);padding-top:18px;border-top:1px solid rgba(230,244,243,.18);max-width:560px;animation:gateUp .7s .22s ease both}
.stage-room small{display:block;color:rgba(143,176,177,.95);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.stage-room .room{font-family:var(--fd);font-weight:700;font-size:clamp(28px,4vw,44px);letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stage-room .room.none{font-size:clamp(18px,2.4vw,24px);font-weight:650;color:rgba(230,244,243,.72)}
.lamp{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin-top:8px;color:rgba(230,244,243,.9)}
.lamp i{width:9px;height:9px;border-radius:50%;background:#78909a}
.lamp.ok i{background:#4cc995;box-shadow:0 0 0 4px rgba(76,201,149,.18)}.lamp.warn i{background:#f0b04a;box-shadow:0 0 0 4px rgba(240,176,74,.18)}
@keyframes gateIn{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
@keyframes gateUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--fd);font-weight:650;font-size:16px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none;overflow:hidden}
.mark.img{background:transparent;padding:0;box-shadow:none}
.mark.img img{width:100%;height:100%;object-fit:contain;display:block}
.side .mark.img{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.92);padding:4px}
.bar .mark.img{width:36px;height:36px;border-radius:9px;background:#fff;padding:3px}
.brand .bn{line-height:1.2}
.logoprev,.bgprev{width:88px;height:88px;border-radius:14px;border:1px solid var(--line);background:var(--raise);display:grid;place-items:center;overflow:hidden;flex:none}
.bgprev{width:160px;height:96px}.logoprev img,.bgprev img{width:100%;height:100%;object-fit:contain;display:block}.bgprev img{object-fit:cover}
.formside{display:grid;place-items:center;padding:clamp(28px,5vw,48px) 28px;background:
  radial-gradient(1200px 500px at 100% -10%,rgba(11,107,115,.1),transparent 55%),
  radial-gradient(800px 420px at 0% 110%,rgba(11,107,115,.08),transparent 50%),
  var(--paper)}
.form{width:100%;max-width:400px;animation:gateUp .65s .08s ease both}
.form-brand{display:none;align-items:center;gap:12px;margin-bottom:22px}
.form-brand img{width:52px;height:52px;object-fit:contain;display:block}
.form-brand .bn{font-family:var(--fd);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.2}
.form h1{font-size:clamp(26px,3vw,32px);line-height:1.15;letter-spacing:-.02em}
.form .lead{margin:8px 0 22px;color:var(--mu);font-size:15px}
.form .btn.pri{width:100%;min-height:46px;margin-top:20px;font-size:15px}
.note{display:flex;gap:10px;margin-top:18px;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.45}
.note svg{margin-top:1px}
.note.err{background:var(--danger-soft);color:var(--danger)}.note.info{background:var(--brand-soft);color:var(--brand)}
.foot{margin-top:26px;color:var(--mu);font-size:12.5px}
@media(max-width:900px){
  .gate{grid-template-columns:1fr}
  .stage{min-height:42vh;padding:28px 22px 32px;justify-content:flex-end}
  .stage-name{font-size:clamp(28px,8vw,40px)}
  .form-brand{display:flex}
}
@media(prefers-reduced-motion:reduce){.stage-photo,.stage-copy,.stage-room,.form{animation:none}}

/* ---------- staff shell ---------- */
.shell{display:grid;grid-template-columns:var(--side-w,232px) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.shell.nav-collapsed{--side-w:72px}
.work{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.side{background:var(--stage);color:var(--stage-ink);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;z-index:30;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain}
.side-head{display:flex;align-items:center;gap:6px;padding:2px 2px 14px;min-height:44px}
.side-head .brand{padding:0;flex:1;min-width:0;overflow:hidden}
.side-head .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .mark{background:#3fb7bf;color:#04191b;flex:none}
.side .nav-toggle,.side .side-close{background:transparent;border-color:rgba(143,176,177,.35);color:var(--stage-ink);flex:none}
.side .nav-toggle:hover,.side .side-close:hover{background:rgba(143,176,177,.14);border-color:rgba(143,176,177,.45)}
.side-close{display:none}
.side nav{display:grid;gap:2px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border:0;background:none;border-radius:9px;color:var(--stage-mu);font-weight:550;cursor:pointer;text-align:left;width:100%;min-height:40px}
.nav:hover{background:rgba(143,176,177,.12);color:var(--stage-ink)}
.nav.on{background:rgba(63,183,191,.18);color:#fff}
.nav .nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .n{margin-left:auto;background:#f0b04a;color:#2b1c00;border-radius:99px;font-size:11.5px;font-weight:700;padding:0 7px;flex:none}
.me{margin-top:auto;border-top:1px solid rgba(143,176,177,.2);padding-top:14px;display:grid;gap:10px}
.me b{display:block;color:#fff}.me span{font-size:12.5px;color:var(--stage-mu)}
.me .row{display:flex;gap:8px}.me .btn{background:transparent;border-color:rgba(143,176,177,.35);color:var(--stage-ink);flex:1}.me .btn:hover{background:rgba(143,176,177,.14)}.me .btn.icon{flex:0 0 36px}
.me .who{min-width:0}.me .who b,.me .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrim{display:none;position:fixed;inset:0;background:rgba(5,20,22,.48);z-index:25;border:0;padding:0;cursor:pointer}
.topbar{display:none;align-items:center;gap:10px;padding:10px 16px;min-height:56px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar .brand{min-width:0}.topbar .bn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.topbar .grow{flex:1}
.main{padding:28px 32px 48px;min-width:0;flex:1}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:24px}.ph p{color:var(--mu);margin-top:2px}

/* desktop collapsed: icon rail */
.shell.nav-collapsed .side{padding:14px 10px}
.shell.nav-collapsed .side-head{justify-content:center;padding-bottom:10px}
.shell.nav-collapsed .side-head .brand,.shell.nav-collapsed .nav .nl,.shell.nav-collapsed .me .who,.shell.nav-collapsed .me .btn:not(.icon){display:none}
.shell.nav-collapsed .nav{justify-content:center;padding:10px;gap:0}
.shell.nav-collapsed .nav .n{position:absolute;top:4px;right:4px;margin:0;padding:0 5px;font-size:10px;min-width:16px;text-align:center}
.shell.nav-collapsed .nav{position:relative}
.shell.nav-collapsed .me .row{justify-content:center}

@media(max-width:960px){
  .shell,.shell.nav-collapsed{grid-template-columns:1fr;--side-w:0px}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,88vw);height:100%;height:100dvh;transform:translateX(-105%);transition:transform .22s ease;box-shadow:none;padding:14px 12px 20px}
  .shell.nav-open .side{transform:translateX(0);box-shadow:12px 0 40px rgba(0,0,0,.28)}
  .shell.nav-open .scrim{display:block}
  .side-close{display:inline-flex}
  .side-head .nav-toggle{display:none}
  .shell.nav-collapsed .side-head .brand,.shell.nav-collapsed .nav .nl,.shell.nav-collapsed .me .who,.shell.nav-collapsed .me .btn:not(.icon){display:revert}
  .shell.nav-collapsed .side-head .brand{display:flex}
  .shell.nav-collapsed .nav{justify-content:flex-start;padding:9px 11px;gap:11px;position:static}
  .shell.nav-collapsed .nav .n{position:static;margin-left:auto;padding:0 7px;font-size:11.5px}
  .topbar{display:flex}
  .main{padding:18px 14px 36px}
  .ph{margin-bottom:14px}.ph h1{font-size:20px}
  .ctl{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  th,td{padding:10px 12px}
  .det{position:static}
}
@media(max-width:640px){
  .ctl{grid-template-columns:repeat(2,1fr)}
  .inline>*{flex:1 1 100%}.inline>.btn{flex:1 1 auto}
  .acts{justify-content:stretch}.acts .btn{flex:1 1 auto}
}

/* ---------- monitor ---------- */
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:18px;padding:6px 8px;align-items:stretch}
.facts.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.facts>div{display:flex;flex-direction:column;gap:4px;padding:16px 18px;min-width:0;border-right:1px solid var(--line)}
.facts>div:last-child{border-right:0}
.facts b{font-family:var(--fd);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.facts span{color:var(--mu);font-size:12.5px;line-height:1.3}
@media(max-width:1100px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}.facts>div{border-bottom:1px solid var(--line);padding:14px 16px}.facts>div:nth-child(3n){border-right:0}.facts>div:nth-child(n+4){border-bottom:0}.facts b{font-size:22px}}
@media(max-width:640px){.facts,.facts.cols-3{grid-template-columns:repeat(2,minmax(0,1fr));padding:4px 6px}.facts>div{padding:12px;border-right:0!important;border-bottom:1px solid var(--line)}.facts>div:nth-child(odd){border-right:1px solid var(--line)!important}.facts>div:nth-last-child(-n+2){border-bottom:0}.facts.cols-3>div:last-child{grid-column:1/-1;border-right:0!important}.facts b{font-size:20px}}
.mon{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.mon.has-det{grid-template-columns:minmax(0,1fr) 400px}
@media(max-width:1180px){.mon,.mon.has-det{grid-template-columns:1fr}}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line2);background:var(--surface);padding:5px 14px;border-radius:99px;cursor:pointer;font-weight:550;color:var(--mu)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fl{font-family:var(--fd);font-weight:650;font-size:13.5px;color:var(--mu);margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px;cursor:pointer;box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--line2)}
.tile.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.scr{aspect-ratio:16/9;background:var(--stage);border-radius:8px;display:grid;place-items:center;color:var(--stage-mu);font-size:12.5px;overflow:hidden}
.scr img{width:100%;height:100%;object-fit:cover;display:block}
.tt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 3px 0}
.tt b{font-family:var(--fd);font-size:15px}
.tf{display:flex;justify-content:space-between;gap:8px;margin:3px 3px 2px;font-size:12.5px;color:var(--mu);min-height:20px}
.tf label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.big{aspect-ratio:16/9;background:var(--stage);border-radius:10px;display:grid;place-items:center;color:var(--stage-mu);overflow:hidden;margin:14px 0}
.big img{width:100%;height:100%;object-fit:contain}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv dt{color:var(--mu)}.kv dd{margin:0}
.sec{font-weight:650;font-size:13px;margin:18px 0 8px;font-family:var(--fd)}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ctl .btn{padding:7px 6px}
.det{position:sticky;top:20px}
.bulk{margin-bottom:16px;border-color:var(--brand)}

/* ---------- full screen presenter view ---------- */
.fsv{position:fixed;inset:0;z-index:30;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.fsv-top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid rgba(143,176,177,.2);min-height:58px}
.fsv-top b{font-family:var(--fd);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.fsv-top .grow{flex:1}
.fsv-main{flex:1;min-height:0;display:grid;place-items:center;padding:14px}
.fsv-scr{width:100%;height:100%;min-height:0;display:grid;place-items:center}

.fsv-msg{color:var(--stage-mu);text-align:center;font-size:18px;max-width:560px;line-height:1.5}.fsv-msg b{display:block;color:var(--stage-ink);font-size:22px;margin-bottom:6px;font-family:var(--fd)}
.fsv-count{font-family:var(--fd);font-weight:700;font-size:clamp(48px,12vw,140px);line-height:1;font-variant-numeric:tabular-nums;color:var(--stage-ink)}
.fsv-bar{padding:12px 18px 18px;border-top:1px solid rgba(143,176,177,.2);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.fsv-bar .btn{min-height:52px;padding:10px 22px;font-size:16px}.fsv-bar .btn.nx{min-width:200px}
.fsv-bar select{max-width:360px;min-height:52px}
.fsv .btn:not(.pri):not(.dng-solid){background:rgba(143,176,177,.14);border-color:rgba(143,176,177,.4);color:var(--stage-ink)}
.fsv .btn:not(.pri):hover{background:rgba(143,176,177,.26)}
.fsv-prog{height:4px;background:rgba(143,176,177,.25)}.fsv-prog i{display:block;height:100%;background:#3fb7bf}
.fsv-main{position:relative}.fsv-scr img.fsv-slide{width:100%;height:100%;aspect-ratio:auto;object-fit:contain}
.fsv-nx{position:absolute;right:22px;bottom:22px;width:min(19vw,250px);background:rgba(0,0,0,.6);border:1px solid rgba(143,176,177,.3);border-radius:10px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.5)}.fsv-nx span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0e0;margin:0 2px 4px}.fsv-nx img{display:block;width:100%;border-radius:5px}
@media(max-width:900px){.fsv-nx{display:none}}
.fsv-keys{color:var(--stage-mu);font-size:12.5px;text-align:center;padding-bottom:8px}.fsv-keys kbd{border:1px solid rgba(143,176,177,.4);border-radius:5px;padding:0 6px}
@media(max-width:640px){.fsv-bar .btn{min-height:48px;padding:8px 14px}.fsv-bar .btn.nx{min-width:0;flex:1 1 40%}.fsv-keys{display:none}}

/* ---------- faculty console ---------- */
@media(max-width:640px){.bar .fsl{display:none}.bar{gap:6px;padding:8px 10px;height:auto;min-height:56px;flex-wrap:wrap}.bar .brand>span:last-child{display:none}.plate{font-size:13px;padding:5px 10px;max-width:100%}.drop{margin:14px}.lec{padding:12px 14px;gap:10px;flex-wrap:wrap}.lec .acts,.lec .btn{margin-left:0}.pod{padding:16px}.trio{grid-template-columns:1fr}.next{min-height:72px;font-size:18px}}
.bar{display:flex;align-items:center;gap:16px;padding:0 28px;height:62px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .grow{flex:1;min-width:8px}
.plate{display:inline-flex;align-items:center;gap:10px;background:var(--stage);color:var(--stage-ink);border-radius:10px;padding:6px 14px 6px 12px;font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.02em;max-width:min(100%,280px);min-width:0}
.plate #plateTxt,.plate span:not(i){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.plate i{width:9px;height:9px;border-radius:50%;background:#4cc995;box-shadow:0 0 0 3px rgba(76,201,149,.2);flex:none}
.plate.off i{background:#f0b04a;box-shadow:0 0 0 3px rgba(240,176,74,.2)}
.plate small{font-family:var(--ff);font-weight:500;color:var(--stage-mu);font-size:12.5px;letter-spacing:0}
.who{text-align:right;line-height:1.25;min-width:0}.who b{display:block}.who span{color:var(--mu);font-size:12.5px}
.console{max-width:1180px;margin:0 auto;padding:28px 28px 56px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;align-items:start}
@media(max-width:980px){.console{grid-template-columns:1fr;padding:18px 16px}.bar{padding:0 14px}.bar .who{display:none}}
.drop{display:grid;justify-items:center;gap:6px;text-align:center;padding:22px;border:1.5px dashed var(--line2);border-radius:12px;margin:18px 20px;color:var(--mu);cursor:pointer;transition:background .12s,border-color .12s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.drop b{color:var(--ink)}
.lec{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line)}
.lec .ic{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.lec .t{flex:1;min-width:0}.lec .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lec .t span{color:var(--mu);font-size:12.5px}
.lec.now{background:var(--live-soft)}.lec.now .ic{background:var(--live);color:#fff}
.pod{padding:22px}
.pod .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.now h2{font-size:21px;line-height:1.25;margin:16px 0 4px;overflow-wrap:anywhere}
.prog{height:8px;border-radius:99px;background:var(--off-soft);overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.cnt{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.next{width:100%;min-height:92px;margin-top:18px;font-size:22px;font-family:var(--fd);font-weight:650;border-radius:14px}
.next svg{width:26px;height:26px}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.trio .btn{min-height:50px}
.trio .wide{grid-column:1/-1}
.keys{margin-top:16px;color:var(--mu);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
kbd{font:600 11.5px var(--ff);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--raise)}
.idle{text-align:center;padding:26px 8px 8px}
.idle .ic{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}

.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;margin-bottom:16px;font-size:13.5px}
.banner.warn{background:var(--amber-soft);color:var(--amber)}.banner.err{background:var(--danger-soft);color:var(--danger)}
.banner .grow{flex:1}.banner .btn{flex:none;margin-top:-2px}
.lock-badge{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;background:var(--live-soft);color:var(--live);font-weight:600;margin-bottom:14px}
.lock-badge b{font-family:var(--fd);font-size:16px;color:var(--ink)}.lock-badge span{font-weight:500;color:var(--mu);font-size:12.5px}
.room-chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.room-chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:550}
.room-chip:hover{border-color:var(--brand)}.room-chip:disabled{opacity:.45;cursor:not-allowed}
.room-chip .pill{pointer-events:none}
.quick-present{margin:0 20px 14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--raise);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.quick-present .t{flex:1;min-width:0}.quick-present .t b{display:block}.quick-present .t span{color:var(--mu);font-size:12.5px}
.xf-hist{margin-top:12px}.xf-hist .xfr{padding:6px 0}
.rc-tip{padding:8px 12px;background:#1a3a2e;border-bottom:1px solid #2a4a40;color:#c8f0dc;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.rc-tip .grow{flex:1}.rc-tip .btn{flex:none}
.fsv-rot{display:none;text-align:center;color:var(--stage-mu);font-size:12.5px;padding:6px 12px}
.fsv-time{font-variant-numeric:tabular-nums;font-weight:650;color:var(--stage-mu);font-size:13px}

@media(max-width:640px){.lec .btn,.trio .btn,.quick-present .btn{min-height:44px;padding:8px 14px}.room-chip{min-height:44px;flex:1 1 calc(50% - 8px);justify-content:center}}

/* ---------- help requests ---------- */
.plate.s{font-size:14px;padding:4px 11px 4px 10px}.plate.done i{background:#7d93a0;box-shadow:none}
.chips.mb{margin-bottom:16px}
.ticket{padding:18px 20px}.ticket+.ticket{margin-top:14px}

.th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.th .grow{flex:1}

.ticket .meta{color:var(--mu);font-size:12.5px}
.thread{margin:14px 0 0;display:grid;gap:8px}
.cm{padding:9px 12px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.cm.av{background:var(--brand-soft);border-color:transparent}
.cm p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.cm b{font-size:13px}
.reply{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.reply input{flex:1 1 240px}
.hlp .thread{margin-top:10px}.hlp .msg{margin:8px 0 0}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.cfg .full{grid-column:1/-1}

/* ---------- monitoring ---------- */
.tl{display:flex;justify-content:space-between;gap:8px;margin:7px 3px 0;font-size:12.5px}.tl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.tl span{color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog.t{height:5px;margin:6px 3px 2px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:0}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.feed li:first-child{border-top:0}
.feed time{color:var(--mu);font-variant-numeric:tabular-nums}.feed b{font-weight:600}
table.nw td{white-space:nowrap}.nw .acts{flex-wrap:nowrap}
code.aid{font:600 12.5px ui-monospace,"Cascadia Mono",Consolas,monospace;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:3px 8px;letter-spacing:.02em;white-space:nowrap}

/* ---------- overlays ---------- */
.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:10060;max-width:min(420px,calc(100vw - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:11px;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);animation:in .18s ease-out}
.toast.err{background:var(--danger);color:#fff}.toast.ok svg{color:var(--live)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(5,20,22,.55);display:grid;place-items:center;padding:20px;z-index:10050}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dlg h2{font-size:19px;margin-bottom:6px}
.dlg .acts{margin-top:22px}.dlg .note{margin-top:14px}
.sk{height:200px;border-radius:14px;background:linear-gradient(90deg,var(--off-soft),var(--raise),var(--off-soft));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.rc{position:fixed;inset:0;z-index:9999;background:#0b0d10;display:flex;flex-direction:column;color:#e8eaed}
.rc-top{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#14181d;border-bottom:1px solid #262b33;flex-wrap:wrap}
.rc-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
.rc-main img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.rc-main.vnc{cursor:default}.vnc-box{width:100%;height:100%;background:#0b0d10}.rc-main .rc-wait{color:#9aa0a6}
.rc-top #rcn{white-space:normal;max-width:min(900px,92vw);line-height:1.3}
.rc-main{position:relative}.rc-cur{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid #fff;border-radius:50%;background:rgba(230,50,50,.85);box-shadow:0 0 0 1px #000;pointer-events:none;display:none}
.rc{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.rc-top .btn.s{min-height:34px}.rc-top .grow{flex:1}
.rc-dr,.rc-keys{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:#101419;border-bottom:1px solid #262b33;color:#cfd3d8}
.rc-dr:empty,.rc-keys:empty{display:none}
.rc-keys textarea{flex:1 1 240px;min-height:56px;border-radius:8px;border:1px solid #3a414b;background:#0b0d10;color:#e8eaed;padding:8px;font:inherit}
.rc-kb{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none;pointer-events:none}
.rc-top select,.rc-dr select{min-height:34px;max-width:220px}
@media(max-width:640px){.rc-top{gap:6px;padding:6px 8px}.rc-top>b{display:none}.rc-top .btn.s{padding:5px 9px;font-size:13px}}
.xf{position:fixed;inset:0;z-index:10040;background:rgba(5,20,22,.62);display:grid;place-items:center;padding:14px;overflow:auto}
.xf .dlg{max-width:540px;max-height:94vh;overflow:auto}.xf .drop{margin:12px 0}
.xfi{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}.xfi .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xfbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.xfbar i{display:block;height:100%;background:var(--brand);transition:width .15s}
.xfi.err .sm{color:#b3261e}.xfi.done .sm{color:#1b7a4b}
.xfr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.xfr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
</style>

<script>
'use strict';
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const S={tok:null,me:null,rooms:[],lects:[],sel:null,tab:'monitor',flt:'all',picked:new Set(),frames:{},logs:[],users:[],sess:[],lq:'',lqL:'',uq:'',ur:'all',lsel:'',bsel:'',lecRoom:'',starting:0,lr:null,lrTimer:null,ws:null,offline:false,choices:null,fs:false,fsel:'',deck:{room:'',gen:0,total:0,have:new Set()},opt:null,loginErr:'',loginInfo:false,help:[],hf:'open',mail:null,navOpen:false,navCollapsed:false,xfHist:[],rcTip:false};
const staff=()=>S.me&&S.me.role!=='teacher';
const ROLE={teacher:'Faculty',av:'AV operator',admin:'Administrator'};

/* ---------- theme ---------- */
const setTheme=t=>{if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;try{t?localStorage.setItem('theme',t):localStorage.removeItem('theme')}catch{}};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}
const toggleTheme=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dark?'light':'dark')};

/* ---------- staff sidebar ---------- */
const navNarrow=()=>matchMedia('(max-width:960px)').matches;
try{S.navCollapsed=localStorage.getItem('navCollapsed')==='1'}catch{}
function applyNav(){
  const sh=document.querySelector('.shell');if(!sh)return;
  const narrow=navNarrow();
  if(!narrow)S.navOpen=false;
  sh.classList.toggle('nav-open',!!S.navOpen);
  sh.classList.toggle('nav-collapsed',!!S.navCollapsed&&!narrow);
  document.body.classList.toggle('nav-lock',!!(narrow&&S.navOpen));
  const open=narrow?!!S.navOpen:!S.navCollapsed;
  document.querySelectorAll('[data-a="navToggle"]').forEach(b=>{
    b.setAttribute('aria-expanded',open?'true':'false');
    b.setAttribute('aria-label',narrow?(open?'Close menu':'Open menu'):(open?'Collapse sidebar':'Expand sidebar'));
    b.title=b.getAttribute('aria-label');
  });
}
function toggleNav(){if(navNarrow())S.navOpen=!S.navOpen;else{S.navCollapsed=!S.navCollapsed;try{localStorage.setItem('navCollapsed',S.navCollapsed?'1':'0')}catch{}}applyNav()}
function closeNav(){if(!S.navOpen)return;S.navOpen=false;applyNav()}

async function api(u,o={}){
  let r,d={};
  try{r=await fetch(u,{...o,headers:{authorization:'Bearer '+S.tok,'content-type':'application/json',...(o.headers||{})}});d=await r.json().catch(()=>({}))}
  catch{toast('Cannot reach the server. Check the network connection.','err');return{error:'network'}}
  if(r.status===401&&S.tok){signedOut('Your sign-in ended. Please sign in again.');return{error:'auth'}}
  if(d.code==='must_change'){forcePassword();return{error:d.error}}
  if(!r.ok){toast(d.error||'Something went wrong.','err');return{error:d.error||'failed'}}

}

function ask({title,text,fields=[],ok='Confirm',danger=false,cancel=true,submit}){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<form class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${esc(title)}</h2>${text?`<p class="mu">${esc(text)}</p>`:''}${fields.map(f=>`<label class="fld"><span>${esc(f.label)}</span>${f.type==='select'?`<select name="${f.name}">${f.options.map(([v,l])=>`<option value="${v}" ${String(f.value??'')===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea name="${f.name}" rows="3" maxlength="${f.max||500}" placeholder="${esc(f.ph||'')}"></textarea>`:`<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" autocomplete="${f.ac||'off'}" ${f.ro?'readonly':''} ${f.max?`maxlength="${f.max}"`:''}>`}</label>`).join('')}<div class="note err" hidden></div><div class="acts">${cancel?'<button type="button" class="btn" data-x>Cancel</button>':''}<button class="btn ${danger?'dng-solid':'pri'}">${esc(ok)}</button></div></form>`;
    document.body.appendChild(m);
    const f=m.querySelector('form'),err=m.querySelector('.note'),close=v=>{m.remove();document.removeEventListener('keydown',esc_);res(v)};
    const esc_=e=>{if(e.key==='Escape'&&cancel)close(null)};document.addEventListener('keydown',esc_);
    m.querySelector('[data-x]')&&(m.querySelector('[data-x]').onclick=()=>close(null));
    f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(submit){const b=f.querySelector('.btn:last-child');b.disabled=true;const msg=await submit(v);b.disabled=false;if(msg){err.hidden=false;err.textContent=msg;return}}close(v||true)};
    (f.querySelector('input,select,textarea')||f.querySelector('.btn:last-child')).focus();
  });
}

function connect(){
  if(!S.tok||S.me.mustChange)return;
  try{S.ws&&(S.ws.onclose=null,S.ws.close())}catch{}
  const ws=S.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+S.tok);
  ws.onopen=()=>{if(S.offline){S.offline=false;paint()}
    if(S.rc){S.rc.ready=0;S.rc.msg='Reconnected to the server. Resuming…';S.rc.cls='help';cmd(S.rc.vnc?'vncstart':'rcstart',S.rc.room);rcBar()}
    if(S.xf)xfList()};   // a dropped connection must not silently end remote control or leave Files stuck on Loading…
  ws.onmessage=e=>{const d=JSON.parse(e.data);
    if(d.t==='rooms'){S.rooms=d.rooms;S.choices=d.choices||[];if(!staff()&&S.me)S.me.room=S.rooms[0]?S.rooms[0].id:null;if(!S.rooms.some(r=>r.id===S.sel))S.sel=null;if(!S.sel&&!S.selOff&&staff())S.sel=S.rooms[0]&&S.rooms[0].id||null;if(!staff()&&!S.sel)S.sel=S.rooms[0]&&S.rooms[0].id||null;
      if(S.starting&&S.rooms.some(r=>r.session))S.starting=0;if(S.rc)rcCheck();paint();if(S.xf){if(S.xf.files===null)xfList();else xfPaintList()}}
    else if(d.t==='deck'){S.deck={room:d.room,gen:d.gen,total:d.total,have:new Set(d.have)};if(S.fs)paint()}
    else if(d.t==='help'){S.help=d.tickets;paint()}
    else if(d.t==='note'){toast(d.m,'ok')}
    else if(d.t==='rcfail'){rcFail(d.m)}
    else if(d.t==='vnc'){vncStart(d)}
    else if(d.t==='rcready'){if(S.rc&&S.rc.room===d.room){S.rc.ready=1;S.rc.lost=0;S.rc.msg='Connected: your mouse and keyboard work on '+d.room;S.rc.cls='live';rcBar()}}
    else if(d.t==='xres'){xfResult(d)}
    else if(d.t==='cur'){rcCur(d)}
    else if(d.t==='err'){S.starting=0;S.opt=null;toast(d.m,'err');paint()}
    else if(d.t==='frame'){S.frames[d.room]=d.data;document.querySelectorAll('[data-f="'+d.room+'"]').forEach(i=>i.src='data:image/jpeg;base64,'+d.data)}
    else if(d.t==='bye'){const m={replaced:'This account was signed in again on another screen.',inactive:'You were signed out after a period of inactivity.','browser closed':'Your sign-in expired.','signed out':'You have signed out.'};
      signedOut(m[d.why]||(/^released/.test(d.why)?'AV staff ended this sign-in.':d.why==='password reset'?'Your password was reset. Sign in with the new one.':'Your sign-in ended.'))}};
  ws.onclose=e=>{if(!S.tok)return;if(e.code===4003)return signedOut('Your sign-in ended. Please sign in again.');S.offline=true;paint();setTimeout(()=>{if(S.tok&&S.ws===ws)connect()},2000)};
}

function curIdx(r){const o=S.opt;if(o&&(o.room!==r.id||realIdx(r)!==o.from||o.until<Date.now()))S.opt=null;return S.opt?S.opt.idx:realIdx(r)}
function optTo(n,room){const r=S.rooms.find(x=>x.id===room);if(!r||!r.session||!r.session.total||!S.ws||S.ws.readyState!==1)return;   // never show a slide the room PC was not told about
  S.opt={room,idx:Math.max(1,Math.min(r.session.total,n)),from:realIdx(r),until:Date.now()+1500};paint()}

/* ---------- remote control: the mouse and keyboard of the room PC, like Remote Desktop ---------- */
const RC_KEYS=[['Esc','Escape'],['Tab','Tab'],['Del','Delete'],['Home','Home'],['End','End'],['PgUp','PageUp'],['PgDn','PageDown'],['←','ArrowLeft'],['↑','ArrowUp'],['↓','ArrowDown'],['→','ArrowRight'],['F5','F5'],['F11','F11']];
const RC_COMBOS=[['Copy',['ControlLeft','KeyC']],['Paste',['ControlLeft','KeyV']],['Cut',['ControlLeft','KeyX']],['Select all',['ControlLeft','KeyA']],['Undo',['ControlLeft','KeyZ']],['Save',['ControlLeft','KeyS']],['Alt+Tab',['AltLeft','Tab']],['Close window',['AltLeft','F4']]];
const RC_PAD=' '.repeat(12);   // the hidden keyboard field always holds a little text, so a phone keyboard's Backspace has something to delete
function rcSend(e){const r=S.rc;if(!r||r.vnc||!S.ws||S.ws.readyState!==1)return;S.ws.send(JSON.stringify({room:r.room,a:'input',e}))}
function rcGone(){const r=S.rc;if(r){r.closing=1;clearTimeout(r.tm);clearTimeout(r.chk);try{r.rfb&&r.rfb.disconnect()}catch{}}S.rc=null;const el=$('rc');el&&el.remove();try{navigator.keyboard&&navigator.keyboard.unlock&&navigator.keyboard.unlock()}catch{}}
function rcTap(codes){codes.forEach(c=>rcSend({k:'kd',c}));codes.slice().reverse().forEach(c=>rcSend({k:'ku',c}))}
const rcMods=()=>[...S.rc.mod].map(m=>m+'Left');
function rcKey(code){rcTap([...rcMods(),code]);if(S.rc.mod.size){S.rc.mod.clear();rcBar()}}
function rcText(t){   // typed text from a phone keyboard or pasted: Ctrl / Alt armed on screen turn a single letter into a shortcut
  const r=S.rc,m=rcMods();
  if(m.length&&t.length===1&&/[a-z0-9]/i.test(t)){rcTap([...m,/\d/.test(t)?'Digit'+t:'Key'+t.toUpperCase()]);r.mod.clear();rcBar();return}
  t.split('\n').forEach((seg,i)=>{if(i)rcTap(['Enter']);for(let p=0;p<seg.length;p+=200)rcSend({k:'tx',t:seg.slice(p,p+200)})});
}
function rcKbInput(ev){   // soft keyboard: send only what changed compared with the last value
  const kb=ev.target,v=kb.value,p=S.rc?S.rc.kbPrev:'';if(!S.rc)return;
  let c=0;while(c<v.length&&c<p.length&&v[c]===p[c])c++;
  for(let i=p.length;i>c;i--)rcTap(['Backspace']);
  if(v.length>c)rcText(v.slice(c));
  S.rc.kbPrev=v;
  if(!ev.isComposing&&(v.length<RC_PAD.length-6||v.length>RC_PAD.length+40)){kb.value=RC_PAD;S.rc.kbPrev=RC_PAD}
}

function vncKeysTray(){
  return `<div class="rc-keys"><button class="btn s" data-a="vncCad">Ctrl+Alt+Del</button><button class="btn s" data-a="vncKey" data-k="65307">Esc</button><button class="btn s" data-a="vncKey" data-k="65289">Tab</button><button class="btn s" data-a="vncKey" data-k="65293">Enter</button>
   ${staff()?'<button class="btn s" data-a="vncKey" data-k="65515">Start</button>':''}<button class="btn s ${S.rc.txt?'pri':''}" data-a="rcTxt">Type text…</button></div>
   ${S.rc.txt?'<div class="rc-keys"><textarea id="rctext" data-rcfree rows="2" placeholder="Type or paste text here, then press Send. It is typed on the room PC."></textarea><button class="btn s pri" data-a="rcSendTxt">Send</button></div>':''}`;
}
function vncType(t){const f=S.rc&&S.rc.rfb;if(!f)return;for(const ch of String(t).slice(0,2000)){const cp=ch.codePointAt(0);f.sendKey(ch==='\n'?65293:cp<256?cp:0x01000000+cp,null)}f.focus()}
async function vncStart(d){
  const q=S.rc;if(!q||!q.vnc||q.room!==d.room)return;
  try{
    const {default:RFB}=await import('/vendor/novnc/core/rfb.js');
    const box=$('vncbox');if(!box||S.rc!==q)return;
    try{q.rfb&&q.rfb.disconnect()}catch{}
    if(!RFB.arrowSet){   // TightVNC sends no pointer shape at first: show a normal mouse arrow instead of nothing or a dot
      const W=12,H=19,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
      g.beginPath();[[0,0],[0,16],[4,12],[7,18],[9,17],[6,11],[11,11]].forEach(([x,y],i)=>i?g.lineTo(x+.5,y+.5):g.moveTo(x+.5,y+.5));g.closePath();
      g.fillStyle='#fff';g.fill();g.strokeStyle='#000';g.lineWidth=1.2;g.stroke();
      RFB.cursors.none={rgbaPixels:new Uint8Array(g.getImageData(0,0,W,H).data),w:W,h:H,hotx:0,hoty:0};RFB.arrowSet=1;
    }
    const rfb=q.rfb=new RFB(box,(location.protocol==='https:'?'wss://':'ws://')+location.host+'/vnc?ticket='+d.ticket,{credentials:{password:d.pass}});
    rfb.scaleViewport=true;rfb.background='#0b0d10';rfb.focusOnClick=true;rfb.qualityLevel=6;rfb.compressionLevel=2;
    rfb.addEventListener('connect',()=>{q.ready=1;q.lost=0;q.msg='Connected: your mouse and keyboard work on '+d.room;q.cls='live';rcBar();rfb.focus()});
    rfb.addEventListener('credentialsrequired',()=>rfb.sendCredentials({password:d.pass}));
    rfb.addEventListener('securityfailure',()=>{if(S.rc===q)rcFail('The room PC did not accept the VNC password.')});
    rfb.addEventListener('disconnect',e=>{if(S.rc===q&&!q.closing&&q.rfb===rfb){if(q.ready)rcClose(e.detail&&e.detail.clean?'The Full access session ended.':'The link to the room PC was lost.');else rcFail('The VNC link to the room PC closed before it was ready.')}});
  }catch(e){if(S.rc===q)rcFail('The VNC viewer could not start ('+(e&&e.message||e)+').')}
}
/** VNC password miss / unreachable: try the next saved password, then fall back to agent remote control — no second click needed. */
function rcFail(m){
  const q=S.rc;if(!q||q.closing)return;
  if(q.failLock&&Date.now()-q.failLock<2000)return;   // securityfailure + server rcfail often arrive together
  q.failLock=Date.now();
  const retryPw=/password|Press Full access again|did not accept|TightVNC|VNC/i.test(m||'');
  if(q.vnc&&retryPw&&(q.vncTries||0)<4){
    q.vncTries=(q.vncTries||0)+1;q.ready=0;
    q.msg='Trying another way to reach the room PC…';q.cls='help';rcBar();
    try{q.rfb&&(q.closing=1,q.rfb.disconnect(),q.closing=0)}catch{}q.rfb=null;
    cmd('vncstart',q.room);return;
  }
  if(q.vnc&&!q.fellBack){
    q.fellBack=1;q.vnc=false;q.ready=0;q.vncTries=0;
    q.msg='Connecting with backup control…';q.cls='help';
    try{q.rfb&&(q.closing=1,q.rfb.disconnect(),q.closing=0)}catch{}q.rfb=null;
    clearTimeout(q.chk);rcDraw();
    cmd('rcstart',q.room);
    q.chk=setTimeout(()=>{if(S.rc&&S.rc.room===q.room&&!S.rc.ready){S.rc.msg='The room PC has not answered. Run its Installer once, then try again.';S.rc.cls='help';rcBar()}},5000);
    toast('Using backup Full access (agent).','ok');return;
  }
  rcClose(m);
}
function rcOpen(room){
  const r=S.rooms.find(x=>x.id===room);
  if(S.rc)return;
  if(!r||!r.online)return toast('This room is not online.','err');
  if(!S.ws||S.ws.readyState!==1)return toast('Not connected to the server yet.','err');
  // Prefer VNC when reachable; if it fails, rcFail falls back to agent RC automatically
  const vnc=!!r.vnc&&!r.vncAuthBad;
  cmd(vnc?'vncstart':'rcstart',room);
  S.rc={vnc,room,down:new Set(),mv:null,tm:0,mod:new Set(),pres:false,keys:false,txt:false,drag:false,ready:0,kbPrev:RC_PAD,mon:0,lost:0,msg:'',cls:'',sig:{},vncTries:0,fellBack:0};
  rcDraw();
  S.rc.chk=setTimeout(()=>{if(S.rc&&S.rc.room===room&&!S.rc.ready){if(S.rc.vnc&&!S.rc.fellBack)rcFail('The VNC service on the room PC has not answered.');else{S.rc.msg='The room PC has not answered. Run its Installer once, then try again.';S.rc.cls='help';rcBar()}}},S.rc.vnc?8000:5000);
  try{if(!document.fullscreenElement&&!document.webkitFullscreenElement){const el=$('rc'),p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);p&&p.catch&&p.catch(()=>{})}   // already in the presenter's full screen: stay in it
    if(navigator.keyboard&&navigator.keyboard.lock)navigator.keyboard.lock().catch(()=>{})}catch{}   // lets Esc, Tab and shortcuts reach the room PC in full screen (Chrome / Edge)
  if(!staff()&&!rcTipSeen())S.rcTip=true;
}
function rcDraw(){

function rcPos(ev){   // where on the room's screen is the pointer? (the picture is letterboxed inside its box)

/* touch: tap = click, two quick taps = double-click, hold = right-click, one finger = move the pointer (or drag when Drag is on), two fingers = scroll */
function rcTouch(el){
  const T={tap:0};const mid=ev=>({x:(ev.touches[0].clientX+ev.touches[1].clientX)/2,y:(ev.touches[0].clientY+ev.touches[1].clientY)/2});
  el.addEventListener('touchstart',ev=>{ev.preventDefault();const r=S.rc;if(!r)return;
    if(ev.touches.length>=2){clearTimeout(T.lp);T.two=true;const m=mid(ev);T.x=m.x;T.y=m.y;T.ax=0;T.ay=0;return}
    const t=ev.touches[0];T.two=false;T.moved=false;T.lpDone=false;T.down=false;T.sx=t.clientX;T.sy=t.clientY;T.p=rcPos(t);
    clearTimeout(T.lp);T.lp=setTimeout(()=>{if(!T.moved&&!T.two&&T.p&&S.rc){T.lpDone=true;rcSend({k:'mv',...T.p});rcSend({k:'md',b:2,...T.p});rcSend({k:'mu',b:2,...T.p});try{navigator.vibrate&&navigator.vibrate(25)}catch{}}},550)},{passive:false});
  el.addEventListener('touchmove',ev=>{ev.preventDefault();const r=S.rc;if(!r)return;
    if(ev.touches.length>=2){if(!T.two)return;const m=mid(ev);T.ay+=T.y-m.y;T.ax+=T.x-m.x;T.x=m.x;T.y=m.y;
      if(Math.abs(T.ay)>=20){rcSend({k:'wh',dy:T.ay*3});T.ay=0}if(Math.abs(T.ax)>=20){rcSend({k:'wx',dy:T.ax*3});T.ax=0}return}
    if(T.two)return;const t=ev.touches[0];
    if(!T.moved){if(Math.hypot(t.clientX-T.sx,t.clientY-T.sy)<10)return;T.moved=true;clearTimeout(T.lp);if(r.drag&&T.p){rcSend({k:'mv',...T.p});rcSend({k:'md',b:0,...T.p});T.down=true;r.down.add(0)}}
    const p=rcPos(t);if(p){T.p=p;rcMove(p)}},{passive:false});
  const end=ev=>{ev.preventDefault();clearTimeout(T.lp);const r=S.rc;if(!r||ev.touches.length>0)return;
    if(T.two){T.two=false;return}
    if(T.down){rcSend({k:'mu',b:0,...(T.p||r.mv||{x:.5,y:.5})});r.down.delete(0);T.down=false;return}
    if(ev.type==='touchend'&&!T.moved&&!T.lpDone&&T.p){rcSend({k:'mv',...T.p});rcSend({k:'md',b:0,...T.p});rcSend({k:'mu',b:0,...T.p});r.mv=T.p}};
  el.addEventListener('touchend',end,{passive:false});el.addEventListener('touchcancel',end,{passive:false});
}

   <p class="mu sm">Saved on the room PC in <b>MCSCMS Files › ${esc(x.folder)}</b>, in a folder just for you. Slides, PDF, Word, Excel, text, images, audio and video, up to ${S.me.xmaxMB||500} MB each. Programs and scripts are never accepted. You can also drop or paste files while Full access is open.</p>

function xfResult(d){
  const x=S.xf;
  if(d.op==='xlist'){if(x&&x.room===d.room&&x.folder===d.folder){x.files=d.ok?(d.files||[]):[];xfPaintList();if(!d.ok)toast(d.error||'Could not read the folder on the room PC.','err')}return}

async function xfSend(files){
  const list=[...files].filter(Boolean);if(!list.length)return;
  let x=S.xf;
  if(!x){
    const room=(S.rc&&S.rc.room)||(!staff()&&S.me&&S.me.room)||null;
    if(!room)return toast('Connect to a lecture room first, then send files.','err');
    xfOpen(room);x=S.xf;if(!x)return;
  }
  for(const f of list){
    const it={name:f.name,pct:0,st:'wait',msg:''};x.items.push(it);xfPaintItems();
    const why=fileProblem(f);if(why){it.st='err';it.msg=why;xfPaintItems();continue}
    if(f.size>(S.me.xmaxMB||500)*1048576){it.st='err';it.msg=`it is larger than ${S.me.xmaxMB||500} MB.`;xfPaintItems();continue}
    await new Promise(res=>{
      const q=new XMLHttpRequest();q.open('POST',`/api/rooms/${encodeURIComponent(x.room)}/transfer?folder=${encodeURIComponent(x.folder)}`);
      q.setRequestHeader('authorization','Bearer '+S.tok);q.setRequestHeader('x-filename',encodeURIComponent(f.name));
      q.upload.onprogress=e=>{if(e.lengthComputable){it.pct=Math.round(e.loaded/e.total*100);it.st=it.pct>=100?'saving':'up';xfPaintItems()}};
      q.onload=()=>{let d={};try{d=JSON.parse(q.responseText)}catch{}
        if(q.status===401){signedOut('Your sign-in ended. Please sign in again.');return res()}
        if(q.status===200&&d.ok){it.st='done';it.name=d.name||f.name;it.pct=100;it.msg='Saved on '+x.room+' in '+d.folder;pushXfHist(x.room,it.name);toast(it.name+' saved on '+x.room,'ok');try{navigator.vibrate&&navigator.vibrate(30)}catch{}if(S.xf===x)xfList()}
        else{it.st='err';it.msg=d.error||(q.status===409?'Another file is still being sent. Wait a few seconds and try again.':'The upload failed.')}
        xfPaintItems();res()};
      q.onerror=()=>{it.st='err';it.msg='Network error. Check the connection and try again.';xfPaintItems();res()};
      q.ontimeout=()=>{it.st='err';it.msg='Timed out. Check that the room PC is online and try again.';xfPaintItems();res()};
      q.timeout=300000;q.send(f);
    });
  }
}
function xfTakeFiles(e){
  const cd=e.clipboardData||e.dataTransfer;if(!cd)return null;
  const out=[];if(cd.files&&cd.files.length)out.push(...cd.files);
  if(!out.length&&cd.items)for(const it of cd.items){if(it.kind==='file'){const f=it.getAsFile();if(f)out.push(f)}}
  return out.length?out:null;
}

function presenterView(r){

  const dk=S.deck,deckOn=slides&&dk.room===r.id&&dk.total>0,idx=slides?curIdx(r):0,ready=deckOn&&dk.have.has(idx),prep=slides&&r.online&&(!deckOn||dk.have.size<dk.total);

      +(s.full?'':`<button class="btn" data-a="ctl" data-c="fullscreen" title="Make the lecture fill the room display">${ic('expand')}Full screen on room</button>`)+`<button class="btn dng" data-a="ctl" data-c="stop">${ic('stop')}End lecture</button>`}

function facultyConsole(){

  :'<p class="mu" style="margin-top:6px">This computer is not connected. Check that it is switched on and the agent is running.</p>'}

  else if(t.status==='open')body=`<div class="th"><span class="pill help">AV help requested</span><span class="grow"></span><span class="meta">${ago(t.at)}</span></div><p class="msg"><b>${CAT[t.category]}</b>${t.message?' · '+esc(t.message):''}</p>${thread(t)}<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn s" data-a="helpNote" data-id="${t.id}">Add a note</button></div>`;
  else body=`<div class="th"><span class="pill live">Resolved</span><span class="grow"></span><span class="meta">${esc(t.resolvedBy||'AV staff')} · ${ago(t.resolvedAt)}</span></div><p class="msg"><b>${CAT[t.category]}</b></p>${thread(t)}<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn s" data-a="helpNew">${ic('bell')}Request AV help again</button></div>`;

function helpTab(){
  const L=S.help,open=L.filter(t=>t.status==='open'),resolved=L.filter(t=>t.status==='resolved'),list=S.hf==='open'?open:S.hf==='resolved'?resolved:L;
  const card=t=>`<article class="card ticket ${t.status}"><div class="th"><span class="plate s ${t.status==='open'?'':'done'}"><i></i>${esc(t.room)}</span><span class="pill ${t.status==='open'?'help':'live'}">${t.status==='open'?'Open':'Resolved'}</span><b>${CAT[t.category]}</b><span class="grow"></span><span class="meta">#${t.id} · ${ago(t.at)}</span></div>
  <p class="msg">${t.message?esc(t.message):'<span class="mu">No details given.</span>'}</p><div class="meta">${esc(t.name)}${t.floor?' · '+esc(t.floor):''} · ${fdate(t.at)}${t.mail?' · '+esc(t.mail):''}</div>${thread(t)}
  ${t.status==='open'?`<div class="reply"><input name="cm${t.id}" placeholder="Add a comment for the faculty member" maxlength="1000" data-c="draft" data-id="${t.id}" aria-label="Comment"><button class="btn" data-a="hcomment" data-id="${t.id}" id="cb${t.id}">Add comment</button><button class="btn pri" data-a="hresolve" data-id="${t.id}">${ic('check')}Resolve</button></div>`
  :`<div class="meta" style="margin-top:12px">Resolved by <b>${esc(t.resolvedBy||'')}</b> · ${fdate(t.resolvedAt)} <button class="btn s" data-a="hreopen" data-id="${t.id}" style="margin-left:8px">Reopen</button></div>`}</article>`;
  return head('Help requests','Requests from lecture rooms. Add a comment, then resolve the request once the problem is fixed.',`<button class="btn" data-a="dlHelp" ${L.length?'':'disabled'} title="Download all help requests for Excel">${ic('down')}Download Excel</button>`)+
  `<div class="card facts cols-3"><div><b>${open.length}</b><span>Open</span></div><div><b>${resolved.length}</b><span>Resolved</span></div><div><b>${L.length}</b><span>All requests</span></div></div>
  <div class="chips mb">${[['open',`Open (${open.length})`],['resolved',`Resolved (${resolved.length})`],['all',`All (${L.length})`]].map(([k,l])=>`<button class="chip ${S.hf===k?'on':''}" data-a="hf" data-k="${k}">${l}</button>`).join('')}</div>`+
  (list.map(card).join('')||`<div class="card empty"><b>${S.hf==='open'?'No open requests':'Nothing here yet'}</b>${S.hf==='open'?'New requests from lecture rooms appear here and are emailed to AV staff.':''}</div>`);
}
function dlHelpExcel(){
  const L=S.help;if(!L.length)return toast('No help requests to download.','err');
  const cell=v=>{const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const when=t=>t?new Date(t).toLocaleString():'';
  const rows=[['ID','Status','Room','Floor','Category','Details','Requested by','Username','Opened at','Resolved by','Resolved at','Comments','Mail note'],
    ...L.map(t=>[t.id,t.status==='open'?'Open':'Resolved',t.room||'',t.floor||'',CAT[t.category]||t.category||'',t.message||'',t.name||'',t.user||'',when(t.at),t.resolvedBy||'',when(t.resolvedAt),(t.comments||[]).map(c=>`${c.by||''}: ${c.text||''}`).join(' | '),t.mail||''])];
  const csv='\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='help-requests-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href);
  toast('Excel file downloaded','ok');
}

function startOnRoom(lectureId,roomId){
  const id=roomId||S.lecRoom,r=S.rooms.find(x=>x.id===id);
  if(!id)return toast('Choose a lecture room first.','err');
  if(!r)return toast('That lecture room was not found.','err');
  if(!r.online)return toast(id+' is offline. Start the agent on that PC first.','err');
  if(!lectureId)return toast('Choose a lecture file first.','err');
  S.lecRoom=id;S.sel=id;S.starting=Date.now();
  cmd('open',id,{lecture:lectureId});
  toast('Opening on '+id+' — stays in this window.','ok');
  paint();setTimeout(()=>{if(S.tok)paint()},20500);
}

async function uploadFiles(files,present=false){
  const ok=[],ids=[];
  for(const f of files){
    const why=fileProblem(f);if(why){toast(`${f.name}: ${why}`,'err');continue}
    toast(`Uploading ${f.name}…`);
    try{const r=await fetch('/api/lectures',{method:'POST',headers:{authorization:'Bearer '+S.tok,'x-filename':encodeURIComponent(f.name)},body:f});const d=await r.json();
      if(r.status===401)return signedOut('Your sign-in ended. Please sign in again.');if(!r.ok)toast(d.error||'Upload failed','err');else{ok.push(f.name);ids.push(d.id)}}catch{toast(`${f.name}: upload failed. Check the network connection and the file size.`,'err')}
  }
  if(ok.length){await loadLects();
    if(present){
      if(staff())startOnRoom(ids[ids.length-1],S.lecRoom);
      else{S.starting=Date.now();cmd('open',null,{lecture:ids[ids.length-1]});paint();setTimeout(()=>{if(S.tok)paint()},20500)}
    }
    else toast(ok.length===1?`${ok[0]} uploaded`:`${ok.length} lectures uploaded`,'ok')}
}

    if(v){toast('Account updated','ok');await loadUsers();paint()}
  },
  resetPw:async b=>{const v=await ask({title:'Reset password for '+b.dataset.id,text:'They will be signed out and must choose a new password at their next sign-in.',fields:[{name:'pass',label:'Temporary password (8+ characters)',type:'password',ac:'new-password'}],ok:'Reset password',submit:async v=>{const d=await fetch('/api/users/'+encodeURIComponent(b.dataset.id)+'/password',{method:'PUT',headers:{authorization:'Bearer '+S.tok,'content-type':'application/json'},body:JSON.stringify(v)}).then(x=>x.json());return d.error||null}});if(v){toast('Password reset','ok');loadUsers().then(paint)}},
  delUser:async b=>{if(!await confirmBox('Remove '+b.dataset.id+'?','The account is deleted and any current sign-in ends.','Remove account'))return;const d=await api('/api/users/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});if(d.ok){toast('Account removed','ok');loadUsers().then(paint)}},
};
async function loadMail(){const d=await api('/api/settings/mail');if(d&&!d.error)S.mail=d}
async function saveMail(f){const v=Object.fromEntries(new FormData(f));const d=await api('/api/settings/mail',{method:'PUT',body:JSON.stringify({...v,secure:!!v.secure,insecureTls:!!v.insecureTls})});if(d.ok){await loadMail();return true}return false}
async function loadUsers(){const d=await api('/api/users');if(Array.isArray(d))S.users=d}
const SUBMIT={
  async saveName(f){const d=await api('/api/settings/name',{method:'PUT',body:JSON.stringify({name:f.name.value})});if(d.ok){await loadBrand();toast('System name saved','ok');render()}},
  async saveMail(f){if(await saveMail(f)){toast('Settings saved','ok');f.pass.value='';paint()}},
  async addRoom(f){const id=f.id.value.trim(),d=await api('/api/rooms',{method:'POST',body:JSON.stringify({id,floor:f.floor.value.trim()||'Ground'})});if(d.ok){f.reset();const v=await ask({title:id+' added',text:'Agent ID: '+d.agentId+'. Download the installer and run it on the lecture room PC.',ok:'Download installer',danger:false});if(v)A.installer({dataset:{id}})}},
  async addUser(f){const d=await api('/api/users',{method:'POST',body:JSON.stringify({user:f.user.value.trim(),name:f.name.value.trim(),pass:f.pass.value,role:f.role.value})});if(d.ok){toast('Account created','ok');f.reset();await loadUsers();paint()}},
};

/* ---------- events ---------- */
Object.assign(A,{
  rcMore:()=>{S.rc.more=!S.rc.more;if(!S.rc.more){S.rc.pres=false;S.rc.keys=false}rcBar()},
  rcPres:()=>{S.rc.pres=!S.rc.pres;rcBar()},
  rcKeys:()=>{S.rc.keys=!S.rc.keys;rcBar()},
  rcTxt:()=>{S.rc.txt=!S.rc.txt;rcBar();const t=$('rctext');t&&t.focus()},
  rcSendTxt:()=>{const t=$('rctext');if(t&&t.value){S.rc.vnc?vncType(t.value):rcText(t.value);t.value=''}},
  vncCad:()=>{S.rc.rfb&&S.rc.rfb.sendCtrlAltDel()},
  vncKey:b=>{S.rc.rfb&&S.rc.rfb.sendKey(+b.dataset.k,null);S.rc.rfb&&S.rc.rfb.focus()},
  rcKb:()=>{const k=$('rckb');if(!k)return;if(document.activeElement===k)k.blur();else k.focus({preventScroll:true})},
  rcDrag:()=>{S.rc.drag=!S.rc.drag;rcBar();toast(S.rc.drag?'Drag mode on: on a touch screen one finger now drags.':'Drag mode off.')},
  rcDbl:()=>{rcSend({k:'dbl',...(S.rc.mv||{x:.5,y:.5})})},
  rcMod:b=>{const m=S.rc.mod,x=b.dataset.m;m.has(x)?m.delete(x):m.add(x);rcBar()},
  rcVKey:b=>rcKey(b.dataset.k),
  rcCombo:b=>rcTap(RC_COMBOS[+b.dataset.i][1]),
  rcCmd:b=>cmd(b.dataset.c,S.rc.room),
  rcEnd:async()=>{if(await confirmBox('End the lecture?','The lecture closes on the room PC and the file is removed from that computer. Remote control stays on.','End lecture')){cmd('stop',S.rc.room);toast('Lecture ended — file closed on the room PC.','ok')}},
  rcPresent:()=>{const l=S.fsel||(S.lects[0]&&S.lects[0].id);if(!l)return toast('Upload a lecture first.','err');S.starting=Date.now();cmd('open',S.rc.room,{lecture:l,full:true})},
  xfOpen:b=>xfOpen(b.dataset.id),xfClose:()=>xfClose(),
  xfOpenFile:b=>{const x=S.xf,f=x&&x.files&&x.files[+b.dataset.i];if(f)cmd('xopen',x.room,{folder:x.folder,name:f.name})},
});
document.addEventListener('change',async e=>{
  const t=e.target;if(!t||!t.files||!t.files[0])return;
  if(t.id==='logoin'){
    const f=t.files[0];t.value='';
    if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>2*1024*1024)return toast('Choose a PNG, JPG or WebP picture of at most 2 MB.','err');
    const d=await api('/api/settings/logo',{method:'PUT',headers:{'content-type':f.type},body:f});
    if(d.ok){await loadBrand();toast('Logo saved','ok');render()}
  }else if(t.id==='bgin'){
    const f=t.files[0];t.value='';
    if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>6*1024*1024)return toast('Choose a PNG, JPG or WebP picture of at most 6 MB.','err');
    const d=await api('/api/settings/loginbg',{method:'PUT',headers:{'content-type':f.type},body:f});
    if(d.ok){await loadBrand();toast('Sign-in picture saved','ok');render()}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='xfin'){xfSend([...t.files]);t.value=''}
  else if(t.dataset.c==='xffolder'&&S.xf){S.xf.folder=t.value;xfDraw();xfList()}
  else if(t.dataset.c==='rcmon'&&S.rc){S.rc.mon=+t.value;cmd('mon',S.rc.room,{n:+t.value})}
  else if(t.dataset.c==='rcgoto'&&S.rc){cmd('goto',S.rc.room,{n:+t.value});t.blur()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='stop-prop'){e.stopPropagation();return}
  if(b.dataset.a==='pick'){e.stopPropagation();A.pick(b);return}
  if(b.matches('label.drop,[data-a="drop"]'))return;
  const f=A[b.dataset.a];if(f){e.preventDefault();f(b)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='upf'){uploadFiles([...t.files],canPresentNow()||canStaffPresent());t.value=''}
  if(t.dataset.c==='gotosel'){const r=S.rooms[0];if(r){optTo(+t.value,r.id);cmd('goto',null,{n:+t.value})}t.blur();return}
  if(t.dataset.c==='fsel')S.fsel=t.value;if(t.dataset.c==='lsel')S.lsel=t.value;if(t.dataset.c==='bsel')S.bsel=t.value;
  if(t.dataset.c==='lecRoom'){S.lecRoom=t.value;if(t.value)S.sel=t.value;paint()}
});
document.addEventListener('input',e=>{
  const c=e.target.dataset.c;if(c!=='lq'&&c!=='uq'&&c!=='lqL')return;
  if(c==='lq')S.lq=e.target.value;else if(c==='uq')S.uq=e.target.value;else S.lqL=e.target.value;
  const p=e.target.selectionStart;paint();const n=$(c);if(n){n.focus();try{n.setSelectionRange(p,p)}catch{}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.c==='draft'){e.preventDefault();const b=$('cb'+e.target.dataset.id);b&&b.click()}});
document.addEventListener('submit',e=>{const n=e.target.dataset.submit;if(n&&SUBMIT[n]){e.preventDefault();SUBMIT[n](e.target)}});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){d.classList.remove('over');if(ev==='drop'){e.preventDefault();uploadFiles([...e.dataTransfer.files],canPresentNow()||canStaffPresent())}}}));
document.addEventListener('keydown',e=>{
  if(S.rc)return;
  if(e.key==='Escape'&&S.navOpen){e.preventDefault();closeNav();return}
  if(!S.tok||!S.me||e.target.closest('input,select,textarea,.modal')||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(!staff()){if(k==='Escape'&&S.fs){exitFs();return}if(k==='f'||k==='F'){e.preventDefault();S.fs?exitFs():enterFs();return}}
  const r=staff()?(S.tab==='monitor'&&S.rooms.find(x=>x.id===S.sel)):S.rooms[0];if(!r||!r.session)return;
  if(!r.session.total){
    if(k===' '&&isMedia(r)){e.preventDefault();cmd('playpause',staff()?S.sel:null);return}
    const KM={ArrowRight:'right',ArrowLeft:'left',ArrowUp:'up',ArrowDown:'down',PageUp:'pgup',PageDown:'pgdn',Home:'home',End:'end',' ':'space'};
    if(!staff()&&S.fs&&KM[k]){e.preventDefault();cmd('key',null,{k:KM[k]})}
    return}
  if(k==='ArrowRight'||k==='PageDown'||k===' '||(k==='ArrowDown'&&S.fs&&!staff())){e.preventDefault();if(!staff())optNav(1);cmd('next',staff()?S.sel:null)}
  else if(k==='ArrowLeft'||k==='PageUp'||(k==='ArrowUp'&&S.fs&&!staff())){e.preventDefault();if(!staff())optNav(-1);cmd('prev',staff()?S.sel:null)}
  else if(k==='b'||k==='B'){cmd('blank',staff()?S.sel:null)}
});
setInterval(()=>{if(S.tok&&staff()&&S.tab==='sessions')A.refresh()},10000);
setInterval(()=>{if(!S.tok||staff())return;const r=S.rooms[0];if(r&&r.session&&(!r.owner||r.owner.user===S.me.user)&&($('live')||$('rc')))paint()},15000);
start();
</script>
</body>
