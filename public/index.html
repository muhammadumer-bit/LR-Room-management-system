<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture Room Control</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b6b73'/%3E%3Crect x='6' y='9' width='20' height='12' rx='2' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M12 25h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f2f5f4;--surface:#fff;--raise:#f8fafa;--ink:#0e2a2e;--mu:#587073;--line:#dbe4e3;--line2:#c9d6d5;
  --brand:#0b6b73;--brand-h:#085a61;--brand-soft:#dcefef;--on-brand:#fff;
  --live:#17895c;--live-soft:#ddf3e8;--amber:#a85f00;--amber-soft:#fdefd3;--danger:#b8342a;--danger-soft:#fbe4e1;--off:#6b7d80;--off-soft:#e9eeee;
  --stage:#071b1e;--stage-ink:#e6f4f3;--stage-mu:#8fb0b1;
  --sh:0 1px 2px rgba(10,40,44,.06),0 8px 24px -12px rgba(10,40,44,.14);
  --ff:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fd:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#091a1d;--surface:#102529;--raise:#142d32;--ink:#e5f2f1;--mu:#92adae;--line:#1f3a3f;--line2:#2b4a50;
  --brand:#3fb7bf;--brand-h:#5cc8cf;--brand-soft:#123a40;--on-brand:#04191b;
  --live:#4cc995;--live-soft:#0f3a2b;--amber:#f0b04a;--amber-soft:#3a2d10;--danger:#ff8a80;--danger-soft:#40201d;--off:#97aaac;--off-soft:#1a3236;--sh:none}}
:root[data-theme=dark]{
  --paper:#091a1d;--surface:#102529;--raise:#142d32;--ink:#e5f2f1;--mu:#92adae;--line:#1f3a3f;--line2:#2b4a50;
  --brand:#3fb7bf;--brand-h:#5cc8cf;--brand-soft:#123a40;--on-brand:#04191b;
  --live:#4cc995;--live-soft:#0f3a2b;--amber:#f0b04a;--amber-soft:#3a2d10;--danger:#ff8a80;--danger-soft:#40201d;--off:#97aaac;--off-soft:#1a3236;--sh:none}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--ff);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--fd);font-weight:650;letter-spacing:-.012em}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mu{color:var(--mu)}.sm{font-size:12.5px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor;stroke:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:7px 14px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:550;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;white-space:nowrap}
.btn:hover{border-color:var(--brand);background:var(--raise)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-h);border-color:var(--brand-h)}
.btn.dng{color:var(--danger)}.btn.dng:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn.dng-solid{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--brand-soft);border-color:transparent}
.btn.s{min-height:30px;padding:4px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn.icon{padding:0;width:36px}
input[type=text],input[type=password],input:not([type]),select,textarea{width:100%;min-height:38px;padding:8px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--surface);min-width:0}
textarea{resize:vertical;font:inherit;display:block}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:2px solid var(--brand-soft);outline-offset:0}
.fld{display:block;margin-top:14px}.fld>span{display:block;font-weight:550;margin-bottom:5px;font-size:13px}
.inline{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.inline>*{flex:1 1 150px}.inline>.btn{flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px 2px 8px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{background:var(--live-soft);color:var(--live)}.pill.ready{background:var(--brand-soft);color:var(--brand)}
.pill.help{background:var(--amber-soft);color:var(--amber)}.pill.off{background:var(--off-soft);color:var(--off)}.pill.busy{background:var(--danger-soft);color:var(--danger)}
.pill.live::before{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.card.p{padding:20px}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card>header h3{font-size:15px}
.stack>*+*{margin-top:16px}
.empty{padding:36px 20px;text-align:center;color:var(--mu)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--mu);padding:10px 20px;border-bottom:1px solid var(--line);background:var(--raise)}
td{padding:12px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- sign-in ---------- */
.gate{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr)}
.stage{position:relative;background:var(--stage);color:var(--stage-ink);padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;
  background-image:linear-gradient(rgba(143,176,177,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(143,176,177,.07) 1px,transparent 1px);background-size:44px 44px}
.stage::after{content:"";position:absolute;inset:auto -20% -35% -20%;height:70%;background:radial-gradient(closest-side,rgba(63,183,191,.22),transparent);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--fd);font-weight:650;font-size:16px;letter-spacing:-.01em}
.mark{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.stage .mark{background:#3fb7bf;color:#04191b}
.mark.img,.stage .mark.img,.side .mark.img{background:#fff;padding:3px;overflow:hidden}.mark.img img{width:100%;height:100%;object-fit:contain;display:block}
.stage .mark.img{width:56px;height:56px;border-radius:14px}.side .mark.img{width:44px;height:44px}.brand .bn{line-height:1.2}
.logoprev{width:72px;height:72px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}.logoprev img{width:100%;height:100%;object-fit:contain}
.screen{position:relative;z-index:1;width:100%;max-width:560px;aspect-ratio:16/9;margin:28px 0;border:1px solid rgba(143,176,177,.35);border-radius:12px;background:linear-gradient(160deg,rgba(18,58,64,.75),rgba(7,27,30,.9));display:grid;place-content:center;text-align:center;gap:6px;box-shadow:0 30px 60px -30px #000}
.screen small{color:var(--stage-mu);font-size:13px}
.screen .room{font-family:var(--fd);font-weight:700;font-size:clamp(44px,6.5vw,84px);letter-spacing:.01em;line-height:1;font-variant-numeric:tabular-nums}
.screen .room.none{color:var(--stage-mu);font-size:clamp(24px,3vw,36px);font-weight:650}
.lamp{display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:600;font-size:13.5px;margin-top:6px}
.lamp i{width:9px;height:9px;border-radius:50%;background:#78909a}
.lamp.ok i{background:#4cc995;box-shadow:0 0 0 4px rgba(76,201,149,.18)}.lamp.warn i{background:#f0b04a;box-shadow:0 0 0 4px rgba(240,176,74,.18)}
.stage ul{margin:0;padding:0;list-style:none;position:relative;z-index:1;display:grid;gap:10px;color:var(--stage-mu);max-width:470px}
.stage li{display:flex;gap:10px;align-items:flex-start}.stage li svg{margin-top:2px;color:#3fb7bf}
.formside{display:grid;place-items:center;padding:36px 28px;background:var(--paper)}
.form{width:100%;max-width:380px}
.form h1{font-size:28px;line-height:1.15}
.form .lead{margin:8px 0 22px;color:var(--mu)}
.form .btn.pri{width:100%;min-height:44px;margin-top:20px;font-size:15px}
.note{display:flex;gap:10px;margin-top:18px;padding:12px 14px;border-radius:11px;font-size:13px;line-height:1.45}
.note svg{margin-top:1px}
.note.err{background:var(--danger-soft);color:var(--danger)}.note.info{background:var(--brand-soft);color:var(--brand)}
.foot{margin-top:26px;color:var(--mu);font-size:12.5px}
@media(max-width:860px){.gate{grid-template-columns:1fr}.stage{padding:28px 24px}.screen{margin:18px 0;max-width:420px}.stage ul{display:none}}

/* ---------- staff shell ---------- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--stage);color:var(--stage-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{padding:4px 8px 18px}.side .mark{background:#3fb7bf;color:#04191b}
.side nav{display:grid;gap:2px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border:0;background:none;border-radius:9px;color:var(--stage-mu);font-weight:550;cursor:pointer;text-align:left;width:100%}
.nav:hover{background:rgba(143,176,177,.12);color:var(--stage-ink)}
.nav.on{background:rgba(63,183,191,.18);color:#fff}
.nav .n{margin-left:auto;background:#f0b04a;color:#2b1c00;border-radius:99px;font-size:11.5px;font-weight:700;padding:0 7px}
.me{margin-top:auto;border-top:1px solid rgba(143,176,177,.2);padding-top:14px;display:grid;gap:10px}
.me b{display:block;color:#fff}.me span{font-size:12.5px;color:var(--stage-mu)}
.me .row{display:flex;gap:8px}.me .btn{background:transparent;border-color:rgba(143,176,177,.35);color:var(--stage-ink);flex:1}.me .btn:hover{background:rgba(143,176,177,.14)}.me .btn.icon{flex:0 0 36px}
.main{padding:28px 32px 48px;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph h1{font-size:24px}.ph p{color:var(--mu);margin-top:2px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px}.side .brand{padding:0 8px}.side nav{display:flex;flex-wrap:wrap}.me{margin:0 0 0 auto;border:0;padding:0;display:flex;align-items:center}.me div{display:none}.main{padding:20px 16px}}

/* ---------- monitor ---------- */
.facts{display:flex;flex-wrap:wrap;gap:26px;margin-bottom:18px;padding:14px 20px}
.facts div{display:flex;flex-direction:column}.facts b{font-family:var(--fd);font-size:22px;line-height:1.1}.facts span{color:var(--mu);font-size:12.5px}
.mon{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media(max-width:1180px){.mon{grid-template-columns:1fr}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--line2);background:var(--surface);padding:5px 14px;border-radius:99px;cursor:pointer;font-weight:550;color:var(--mu)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.fl{font-family:var(--fd);font-weight:650;font-size:13.5px;color:var(--mu);margin:20px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:9px;cursor:pointer;box-shadow:var(--sh);transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--line2)}
.tile.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.scr{aspect-ratio:16/9;background:var(--stage);border-radius:8px;display:grid;place-items:center;color:var(--stage-mu);font-size:12.5px;overflow:hidden}
.scr img{width:100%;height:100%;object-fit:cover;display:block}
.tt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:9px 3px 0}
.tt b{font-family:var(--fd);font-size:15px}
.tf{display:flex;justify-content:space-between;gap:8px;margin:3px 3px 2px;font-size:12.5px;color:var(--mu);min-height:20px}
.tf label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.big{aspect-ratio:16/9;background:var(--stage);border-radius:10px;display:grid;place-items:center;color:var(--stage-mu);overflow:hidden;margin:14px 0}
.big img{width:100%;height:100%;object-fit:contain}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}.kv dt{color:var(--mu)}.kv dd{margin:0}
.sec{font-weight:650;font-size:13px;margin:18px 0 8px;font-family:var(--fd)}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ctl .btn{padding:7px 6px}
.det{position:sticky;top:20px}
.bulk{margin-bottom:16px;border-color:var(--brand)}

/* ---------- full screen presenter view ---------- */
.fsv{position:fixed;inset:0;z-index:30;background:var(--stage);color:var(--stage-ink);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.fsv-top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid rgba(143,176,177,.2);min-height:58px}
.fsv-top b{font-family:var(--fd);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.fsv-top .grow{flex:1}
.fsv-main{flex:1;min-height:0;display:grid;place-items:center;padding:14px}
.fsv-scr{width:100%;height:100%;min-height:0;display:grid;place-items:center}
.fsv-scr img{max-width:100%;max-height:100%;aspect-ratio:16/9;object-fit:contain;border-radius:10px;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.fsv-msg{color:var(--stage-mu);text-align:center;font-size:18px;max-width:560px;line-height:1.5}.fsv-msg b{display:block;color:var(--stage-ink);font-size:22px;margin-bottom:6px;font-family:var(--fd)}
.fsv-count{font-family:var(--fd);font-weight:700;font-size:clamp(48px,12vw,140px);line-height:1;font-variant-numeric:tabular-nums;color:var(--stage-ink)}
.fsv-bar{padding:12px 18px 18px;border-top:1px solid rgba(143,176,177,.2);display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.fsv-bar .btn{min-height:52px;padding:10px 22px;font-size:16px}.fsv-bar .btn.nx{min-width:200px}
.fsv-bar select{max-width:360px;min-height:52px}
.fsv .btn:not(.pri):not(.dng-solid){background:rgba(143,176,177,.14);border-color:rgba(143,176,177,.4);color:var(--stage-ink)}
.fsv .btn:not(.pri):hover{background:rgba(143,176,177,.26)}
.fsv-prog{height:4px;background:rgba(143,176,177,.25)}.fsv-prog i{display:block;height:100%;background:#3fb7bf}
.fsv-main{position:relative}.fsv-scr img.fsv-slide{width:100%;height:100%;aspect-ratio:auto;object-fit:contain}
.fsv-nx{position:absolute;right:22px;bottom:22px;width:min(19vw,250px);background:rgba(0,0,0,.6);border:1px solid rgba(143,176,177,.3);border-radius:10px;padding:6px;box-shadow:0 6px 24px rgba(0,0,0,.5)}.fsv-nx span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#cfe0e0;margin:0 2px 4px}.fsv-nx img{display:block;width:100%;border-radius:5px}
@media(max-width:900px){.fsv-nx{display:none}}
.fsv-keys{color:var(--stage-mu);font-size:12.5px;text-align:center;padding-bottom:8px}.fsv-keys kbd{border:1px solid rgba(143,176,177,.4);border-radius:5px;padding:0 6px}
@media(max-width:640px){.fsv-bar .btn{min-height:48px;padding:8px 14px}.fsv-bar .btn.nx{min-width:0;flex:1 1 40%}.fsv-keys{display:none}}

/* ---------- faculty console ---------- */
@media(max-width:640px){.bar .fsl{display:none}.bar{gap:8px;padding:0 10px}.bar .brand>span:last-child{display:none}.plate{font-size:14px;padding:5px 10px}.drop{margin:14px}.lec{padding:12px 14px;gap:10px}.pod{padding:16px}}
.bar{display:flex;align-items:center;gap:16px;padding:0 28px;height:62px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar .grow{flex:1}
.plate{display:inline-flex;align-items:center;gap:10px;background:var(--stage);color:var(--stage-ink);border-radius:10px;padding:6px 14px 6px 12px;font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:.02em}
.plate i{width:9px;height:9px;border-radius:50%;background:#4cc995;box-shadow:0 0 0 3px rgba(76,201,149,.2)}
.plate.off i{background:#f0b04a;box-shadow:0 0 0 3px rgba(240,176,74,.2)}
.plate small{font-family:var(--ff);font-weight:500;color:var(--stage-mu);font-size:12.5px;letter-spacing:0}
.who{text-align:right;line-height:1.25}.who b{display:block}.who span{color:var(--mu);font-size:12.5px}
.console{max-width:1180px;margin:0 auto;padding:28px 28px 56px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:22px;align-items:start}
@media(max-width:980px){.console{grid-template-columns:1fr;padding:18px 16px}.bar{padding:0 14px}.who{display:none}}
.drop{display:grid;justify-items:center;gap:6px;text-align:center;padding:22px;border:1.5px dashed var(--line2);border-radius:12px;margin:18px 20px;color:var(--mu);cursor:pointer;transition:background .12s,border-color .12s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.drop b{color:var(--ink)}
.lec{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line)}
.lec .ic{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.lec .t{flex:1;min-width:0}.lec .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lec .t span{color:var(--mu);font-size:12.5px}
.lec.now{background:var(--live-soft)}.lec.now .ic{background:var(--live);color:#fff}
.pod{padding:22px}
.pod .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.now h2{font-size:21px;line-height:1.25;margin:16px 0 4px;overflow-wrap:anywhere}
.prog{height:8px;border-radius:99px;background:var(--off-soft);overflow:hidden;margin:14px 0 6px}
.prog i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.cnt{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.next{width:100%;min-height:92px;margin-top:18px;font-size:22px;font-family:var(--fd);font-weight:650;border-radius:14px}
.next svg{width:26px;height:26px}
.trio{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.trio .btn{min-height:50px}
.trio .wide{grid-column:1/-1}
.keys{margin-top:16px;color:var(--mu);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap}
kbd{font:600 11.5px var(--ff);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--raise)}
.idle{text-align:center;padding:26px 8px 8px}
.idle .ic{width:60px;height:60px;border-radius:16px;margin:0 auto 14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.idle .ic svg{width:28px;height:28px}
.idle h2{font-size:19px}.idle p{margin-top:6px}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;margin-bottom:16px;font-size:13.5px}
.banner.warn{background:var(--amber-soft);color:var(--amber)}.banner.err{background:var(--danger-soft);color:var(--danger)}

/* ---------- help requests ---------- */
.plate.s{font-size:14px;padding:4px 11px 4px 10px}.plate.done i{background:#7d93a0;box-shadow:none}
.chips.mb{margin-bottom:16px}
.ticket{padding:18px 20px}.ticket+.ticket{margin-top:14px}
.ticket.resolved{background:var(--raise)}
.th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.th .grow{flex:1}
.ticket .msg{margin:12px 0 4px;font-size:15px;overflow-wrap:anywhere}
.ticket .meta{color:var(--mu);font-size:12.5px}
.thread{margin:14px 0 0;display:grid;gap:8px}
.cm{padding:9px 12px;border-radius:10px;background:var(--raise);border:1px solid var(--line)}
.cm.av{background:var(--brand-soft);border-color:transparent}
.cm p{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.cm b{font-size:13px}
.reply{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.reply input{flex:1 1 240px}
.hlp .thread{margin-top:10px}.hlp .msg{margin:8px 0 0}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 16px}
.cfg .full{grid-column:1/-1}

/* ---------- monitoring ---------- */
.tl{display:flex;justify-content:space-between;gap:8px;margin:7px 3px 0;font-size:12.5px}.tl b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.tl span{color:var(--mu);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog.t{height:5px;margin:6px 3px 2px}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:0}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}.feed li:first-child{border-top:0}
.feed time{color:var(--mu);font-variant-numeric:tabular-nums}.feed b{font-weight:600}
table.nw td{white-space:nowrap}.nw .acts{flex-wrap:nowrap}
code.aid{font:600 12.5px ui-monospace,"Cascadia Mono",Consolas,monospace;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:3px 8px;letter-spacing:.02em;white-space:nowrap}

/* ---------- overlays ---------- */
.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:10060;max-width:min(420px,calc(100vw - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:11px;box-shadow:0 14px 30px -12px rgba(0,0,0,.45);animation:in .18s ease-out}
.toast.err{background:var(--danger);color:#fff}.toast.ok svg{color:var(--live)}
@keyframes in{from{transform:translateY(8px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(5,20,22,.55);display:grid;place-items:center;padding:20px;z-index:10050}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;width:100%;max-width:420px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dlg h2{font-size:19px;margin-bottom:6px}
.dlg .acts{margin-top:22px}.dlg .note{margin-top:14px}
.sk{height:200px;border-radius:14px;background:linear-gradient(90deg,var(--off-soft),var(--raise),var(--off-soft));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.rc{position:fixed;inset:0;z-index:9999;background:#0b0d10;display:flex;flex-direction:column;color:#e8eaed}
.rc-top{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#14181d;border-bottom:1px solid #262b33;flex-wrap:wrap}
.rc-main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:none}
.rc-main img{width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.rc-main.vnc{cursor:default}.vnc-box{width:100%;height:100%;background:#0b0d10}.rc-main .rc-wait{color:#9aa0a6}
.rc-top #rcn{white-space:normal;max-width:min(900px,92vw);line-height:1.3}
.rc-main{position:relative}.rc-cur{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid #fff;border-radius:50%;background:rgba(230,50,50,.85);box-shadow:0 0 0 1px #000;pointer-events:none;display:none}
.rc{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.rc-top .btn.s{min-height:34px}.rc-top .grow{flex:1}
.rc-dr,.rc-keys{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:#101419;border-bottom:1px solid #262b33;color:#cfd3d8}
.rc-dr:empty,.rc-keys:empty{display:none}
.rc-keys textarea{flex:1 1 240px;min-height:56px;border-radius:8px;border:1px solid #3a414b;background:#0b0d10;color:#e8eaed;padding:8px;font:inherit}
.rc-kb{position:absolute;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;resize:none;pointer-events:none}
.rc-top select,.rc-dr select{min-height:34px;max-width:220px}
@media(max-width:640px){.rc-top{gap:6px;padding:6px 8px}.rc-top>b{display:none}.rc-top .btn.s{padding:5px 9px;font-size:13px}}
.xf{position:fixed;inset:0;z-index:10040;background:rgba(5,20,22,.62);display:grid;place-items:center;padding:14px;overflow:auto}
.xf .dlg{max-width:540px;max-height:94vh;overflow:auto}.xf .drop{margin:12px 0}
.xfi{display:grid;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}.xfi .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xfbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.xfbar i{display:block;height:100%;background:var(--brand);transition:width .15s}
.xfi.err .sm{color:#b3261e}.xfi.done .sm{color:#1b7a4b}
.xfr{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}.xfr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
</style>

<body>

<div id="app"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
const $=i=>document.getElementById(i);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#${n}"/></svg>`;
const S={tok:null,me:null,rooms:[],lects:[],sel:null,tab:'monitor',flt:'all',picked:new Set(),frames:{},logs:[],users:[],sess:[],lq:'',lsel:'',bsel:'',starting:0,lr:null,lrTimer:null,ws:null,offline:false,choices:null,fs:false,fsel:'',deck:{room:'',gen:0,total:0,have:new Set()},opt:null,loginErr:'',loginInfo:false,help:[],hf:'open',mail:null};
const staff=()=>S.me&&S.me.role!=='teacher';
const ROLE={teacher:'Faculty',av:'AV operator',admin:'Administrator'};

/* ---------- theme ---------- */
const setTheme=t=>{if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;try{t?localStorage.setItem('theme',t):localStorage.removeItem('theme')}catch{}};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch{}
const toggleTheme=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dark?'light':'dark')};

/* ---------- helpers ---------- */
const toast=(m,k='')=>{const t=document.createElement('div');t.className='toast '+k;t.innerHTML=(k==='ok'?ic('check'):k==='err'?ic('info'):'')+`<span>${esc(m)}</span>`;$('toasts').appendChild(t);setTimeout(()=>t.remove(),k==='err'?6000:3500)};
const fdate=x=>new Date(x).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000|0);return s<60?'just now':s<3600?(s/60|0)+' min ago':s<86400?(s/3600|0)+' h ago':(s/86400|0)+' d ago'};
const fsize=n=>!n?'':n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const store={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}},del:k=>{try{sessionStorage.removeItem(k)}catch{}}};

async function api(u,o={}){
  let r,d={};
  try{r=await fetch(u,{...o,headers:{authorization:'Bearer '+S.tok,'content-type':'application/json',...(o.headers||{})}});d=await r.json().catch(()=>({}))}
  catch{toast('Cannot reach the server. Check the network connection.','err');return{error:'network'}}
  if(r.status===401&&S.tok){signedOut('Your sign-in ended. Please sign in again.');return{error:'auth'}}
  if(d.code==='must_change'){forcePassword();return{error:d.error}}
  if(!r.ok){toast(d.error||'Something went wrong.','err');return{error:d.error||'failed'}}
  return d;
}

function ask({title,text,fields=[],ok='Confirm',danger=false,cancel=true,submit}){
  return new Promise(res=>{
    const m=document.createElement('div');m.className='modal';
    m.innerHTML=`<form class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${esc(title)}</h2>${text?`<p class="mu">${esc(text)}</p>`:''}${fields.map(f=>`<label class="fld"><span>${esc(f.label)}</span>${f.type==='select'?`<select name="${f.name}">${f.options.map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select>`:f.type==='textarea'?`<textarea name="${f.name}" rows="3" maxlength="${f.max||500}" placeholder="${esc(f.ph||'')}"></textarea>`:`<input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" autocomplete="${f.ac||'off'}">`}</label>`).join('')}<div class="note err" hidden></div><div class="acts">${cancel?'<button type="button" class="btn" data-x>Cancel</button>':''}<button class="btn ${danger?'dng-solid':'pri'}">${esc(ok)}</button></div></form>`;
    document.body.appendChild(m);
    const f=m.querySelector('form'),err=m.querySelector('.note'),close=v=>{m.remove();document.removeEventListener('keydown',esc_);res(v)};
    const esc_=e=>{if(e.key==='Escape'&&cancel)close(null)};document.addEventListener('keydown',esc_);
    m.querySelector('[data-x]')&&(m.querySelector('[data-x]').onclick=()=>close(null));
    f.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(submit){const b=f.querySelector('.btn:last-child');b.disabled=true;const msg=await submit(v);b.disabled=false;if(msg){err.hidden=false;err.textContent=msg;return}}close(v||true)};
    (f.querySelector('input,select,textarea')||f.querySelector('.btn:last-child')).focus();
  });
}
const confirmBox=(title,text,ok,danger=true)=>ask({title,text,ok,danger});

/* ---------- lecture files ---------- */
const KL={slides:'Slides',pdf:'PDF',video:'Video',audio:'Audio',image:'Image',doc:'Document',other:'File'};
// Any lecture file may be uploaded except programs, scripts, shortcuts, macro files and web pages (the server enforces this too).
const BLOCKED=new Set(('exe msi msp bat cmd com scr pif ps1 psm1 psd1 vbs vbe js jse wsf wsh hta jar lnk url reg dll sys cpl msc inf gadget application appx appxbundle msix msixbundle apk sh bash py pyw rb pl php docm xlsm pptm dotm xltm potm ppsm ppam xlam xll sldm iso img vhd vhdx dmg chm svg html htm xhtml mht mhtml swf xap crx scf').split(' '));
const fileProblem=f=>{const m=/\.([A-Za-z0-9]{1,8})$/.exec(f.name);if(!m)return 'it needs a normal extension, for example .pptx, .pdf or .mp4.';if(BLOCKED.has(m[1].toLowerCase()))return `.${m[1].toLowerCase()} files (programs, scripts, macro files, web pages) cannot be uploaded.`;const mx=(S.me&&S.me.maxUploadMB||2048)*1048576;if(f.size>mx)return `it is larger than ${Math.round(mx/1048576)} MB.`;return ''};
const isMedia=r=>!!(r&&r.session&&(r.session.kind==='video'||r.session.kind==='audio'));

/* ---------- full screen presenter view ---------- */
function enterFs(){S.fs=true;const r0=S.rooms[0];if(r0&&r0.online&&r0.session&&(!r0.owner||r0.owner.user===S.me.user))cmd('fullscreen');if(S.me.remote&&r0&&r0.online)cmd('stream',null,{hi:true});try{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(f)Promise.resolve(f.call(e)).catch(()=>{})}catch{}paint()}
function exitFs(){const was=S.fs;S.fs=false;{const r1=S.rooms[0];if(was&&S.me&&S.me.remote&&r1&&r1.online)cmd('stream',null,{hi:false})}try{if(document.fullscreenElement||document.webkitFullscreenElement){const x=document.exitFullscreen||document.webkitExitFullscreen;x&&Promise.resolve(x.call(document)).catch(()=>{})}}catch{}if(was&&S.tok)paint()}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>{if(S.fs&&!S.rc&&!document.fullscreenElement&&!document.webkitFullscreenElement)exitFs()}));   // closing the remote desktop must not throw the teacher out of the presenter view; leaving full screen never touches the lecture on the room PC

/* ---------- boot / auth ---------- */
const BR={name:'Lecture Room Control',logo:0};
const brandMark=()=>`<span class="mark ${BR.logo?'img':''}">${BR.logo?`<img src="/logo?v=${BR.logo}" alt="">`:ic('monitor')}</span>`;
function applyBrand(){document.title=BR.name;const l=document.querySelector('link[rel=icon]');if(l&&BR.logo){l.type='image/png';l.href='/logo?v='+BR.logo}}
async function loadBrand(){try{const d=await(await fetch('/api/branding',{cache:'no-store'})).json();BR.name=d.name||BR.name;BR.logo=d.logo|0}catch{}applyBrand()}
async function start(){
  await loadBrand();
  const t=store.get('tok');
  if(t){S.tok=t;const r=await fetch('/api/me',{headers:{authorization:'Bearer '+t}});if(r.ok){S.me=await r.json();return boot()}S.tok=null;store.del('tok')}
  showLogin();
}
function showLogin(msg='',info=false){
  S.loginErr=msg;S.loginInfo=info;render();loadLr();clearInterval(S.lrTimer);S.lrTimer=setInterval(()=>{if(!S.tok)loadLr()},8000);
}
async function loadLr(){try{S.lr=await fetch('/api/lr').then(r=>r.json())}catch{S.lr=null}if(!S.tok)paintLr()}
function signedOut(msg){
  rcGone();S.tok=null;S.me=null;store.del('tok');
  try{S.ws&&(S.ws.onclose=null,S.ws.close())}catch{}
  exitFs();S.ws=null;S.rooms=[];S.choices=null;S.sel=null;S.selOff=0;S.picked.clear();S.tab='monitor';S.starting=0;S.offline=false;S.help=[];
  showLogin(msg||'',true);
}
async function doLogin(e){
  e.preventDefault();const f=e.target,b=f.querySelector('.btn.pri');b.disabled=true;
  let d;try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({user:f.user.value,pass:f.pass.value})});d=await r.json();d.ok=r.ok}catch{d={error:'Cannot reach the server. Check the network connection.'}}
  b.disabled=false;
  if(!d.ok){S.loginErr=d.error||'Sign-in failed.';S.loginInfo=false;paintLoginErr();f.pass.value='';f.pass.focus();loadLr();return}
  S.tok=d.token;S.me=d;store.set('tok',d.token);clearInterval(S.lrTimer);boot();
}
async function doLogout(){await api('/api/logout',{method:'POST',body:'{}'});signedOut('You have signed out.')}

async function boot(){
  S.tab='monitor';S.starting=0;render();
  if(S.me.mustChange){await forcePassword();return}
  await loadLects();connect();
}
let forcing=null;
function forcePassword(){
  if(forcing)return forcing;
  forcing=changePassword(true).then(()=>{forcing=null;if(S.tok){loadLects();connect()}});return forcing;
}
async function changePassword(force=false){
  const v=await ask({title:force?'Set a new password':'Change password',text:force?'You are using a temporary password. Choose a new one to continue.':'Enter your current password, then a new one.',
    fields:[{name:'old',label:'Current password',type:'password',ac:'current-password'},{name:'pass',label:'New password (8+ characters)',type:'password',ac:'new-password'},{name:'again',label:'Repeat new password',type:'password',ac:'new-password'}],
    ok:'Save password',cancel:!force,
    submit:async v=>{if(v.pass!==v.again)return 'The two new passwords do not match.';const r=await fetch('/api/password',{method:'POST',headers:{authorization:'Bearer '+S.tok,'content-type':'application/json'},body:JSON.stringify({old:v.old,pass:v.pass})});const d=await r.json();return r.ok?null:d.error}});
  if(v){S.me.mustChange=false;toast('Password updated','ok')}
  else if(force){return changePassword(true)}
}
async function loadLects(){const d=await api('/api/lectures');if(Array.isArray(d)){S.lects=d;if(S.tok)paint()}}

/* ---------- live connection ---------- */
function connect(){
  if(!S.tok||S.me.mustChange)return;
  try{S.ws&&(S.ws.onclose=null,S.ws.close())}catch{}
  const ws=S.ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?token='+S.tok);
  ws.onopen=()=>{if(S.offline){S.offline=false;paint()}
    if(S.rc){S.rc.ready=0;S.rc.msg='Reconnected to the server. Resuming…';S.rc.cls='help';cmd(S.rc.vnc?'vncstart':'rcstart',S.rc.room);rcBar()}};   // a dropped connection must not silently end remote control
  ws.onmessage=e=>{const d=JSON.parse(e.data);
    if(d.t==='rooms'){S.rooms=d.rooms;S.choices=d.choices||[];if(!staff()&&S.me)S.me.room=S.rooms[0]?S.rooms[0].id:null;if(!S.rooms.some(r=>r.id===S.sel))S.sel=null;if(!S.sel&&!S.selOff&&staff())S.sel=S.rooms[0]&&S.rooms[0].id||null;if(!staff()&&!S.sel)S.sel=S.rooms[0]&&S.rooms[0].id||null;
      if(S.starting&&S.rooms.some(r=>r.session))S.starting=0;if(S.rc)rcCheck();paint();if(S.xf)xfPaintList()}
    else if(d.t==='deck'){S.deck={room:d.room,gen:d.gen,total:d.total,have:new Set(d.have)};if(S.fs)paint()}
    else if(d.t==='help'){S.help=d.tickets;paint()}
    else if(d.t==='note'){toast(d.m,'ok')}
    else if(d.t==='rcfail'){rcClose(d.m)}
    else if(d.t==='vnc'){vncStart(d)}
    else if(d.t==='rcready'){if(S.rc&&S.rc.room===d.room){S.rc.ready=1;S.rc.lost=0;S.rc.msg='Connected: your mouse and keyboard work on '+d.room;S.rc.cls='live';rcBar()}}

function xfDraw(){

   <p class="mu sm">Saved on the room PC in <b>MCSCMS Files › ${esc(x.folder)}</b>, in a folder just for you. Slides, PDF, Word, Excel, text, images, audio and video, up to ${S.me.xmaxMB||500} MB each. Programs and scripts are never accepted.</p>

function xfPaintItems(){

  const txt=i=>i.st==='wait'?'Waiting…':i.st==='up'?'Uploading '+i.pct+'%':i.st==='saving'?'Saving on the room PC…':i.msg||'';
  el.innerHTML=S.xf.items.slice(-6).map(i=>`<div class="xfi ${i.st}"><div class="nm">${esc(i.name)}</div><div class="xfbar"><i style="width:${i.st==='done'?100:i.st==='saving'?100:i.pct}%"></i></div><div class="sm">${esc(txt(i))}</div></div>`).join('');
}
function xfPaintList(){
  const el=$('xflist'),x=S.xf;if(!el||!x)return;
  const r=S.rooms.find(y=>y.id===x.room);
  if(x.files===null)el.innerHTML='<p class="mu sm">Loading…</p>';
  else if(!x.files.length)el.innerHTML='<p class="mu sm">Nothing here yet.</p>';
  else el.innerHTML=x.files.map((f,i)=>`<div class="xfr"><span title="${esc(f.name)}">${esc(f.name)} <small class="mu">${fsize(f.size)}</small></span><button class="btn s" data-a="xfOpenFile" data-i="${i}" ${r&&r.online?'':'disabled'}>Open on room PC</button></div>`).join('');
}
function xfList(){const x=S.xf;if(x){x.files=null;xfPaintList();cmd('xlist',x.room,{folder:x.folder})}}
function xfResult(d){
  const x=S.xf;
  if(d.op==='xlist'){if(x&&x.room===d.room&&x.folder===d.folder){x.files=d.ok?(d.files||[]):[];xfPaintList();if(!d.ok)toast(d.error||'Could not read the folder on the room PC.','err')}return}
  if(d.op==='xopen'){d.ok?toast(`Opened ${d.name} on ${d.room}.${S.me.ctl&&!S.rc?' Use Full access to PC to work with it.':''}`,'ok'):toast(d.error||'The room PC could not open that file.','err')}
}
async function xfSend(files){
  const x=S.xf;if(!x)return;
  for(const f of files){
    const it={name:f.name,pct:0,st:'wait',msg:''};x.items.push(it);xfPaintItems();
    const why=fileProblem(f);if(why){it.st='err';it.msg=why;xfPaintItems();continue}
    if(f.size>(S.me.xmaxMB||500)*1048576){it.st='err';it.msg=`it is larger than ${S.me.xmaxMB||500} MB.`;xfPaintItems();continue}
    await new Promise(res=>{
      const q=new XMLHttpRequest();q.open('POST',`/api/rooms/${encodeURIComponent(x.room)}/transfer?folder=${encodeURIComponent(x.folder)}`);
      q.setRequestHeader('authorization','Bearer '+S.tok);q.setRequestHeader('x-filename',encodeURIComponent(f.name));
      q.upload.onprogress=e=>{if(e.lengthComputable){it.pct=Math.round(e.loaded/e.total*100);it.st=it.pct>=100?'saving':'up';xfPaintItems()}};
      q.onload=()=>{let d={};try{d=JSON.parse(q.responseText)}catch{}
        if(q.status===401){signedOut('Your sign-in ended. Please sign in again.');return res()}
        if(q.status===200&&d.ok){it.st='done';it.name=d.name||f.name;it.pct=100;it.msg='Saved on '+x.room+' in '+d.folder;if(S.xf===x)xfList()}else{it.st='err';it.msg=d.error||'The upload failed.'}
        xfPaintItems();res()};
      q.onerror=()=>{it.st='err';it.msg='Network error. Check the connection and try again.';xfPaintItems();res()};
      q.send(f);
    });
  }
}

const head=(t,p,right='')=>`<div class="ph"><div><h1>${t}</h1><p>${p}</p></div><div>${right}</div></div>`;
const dur=ms=>{const m=Math.max(1,Math.round(ms/60000));return m<60?m+' min':(m/60|0)+' h '+(m%60)+' min'};
const rst=r=>!r.online?['Offline','off']:r.assist?['Needs help','help']:r.session?['Presenting','live']:r.faculty?['Signed in','ready']:['Idle','ready'];
const cls=r=>r.session?'Lecture in progress':r.faculty?'Faculty signed in':'Free';

function monitor(){
  const R=S.rooms,f={all:()=>1,online:r=>r.online,offline:r=>!r.online,help:r=>r.assist}[S.flt],V=R.filter(f),floors=[...new Set(V.map(r=>r.floor))],x=R.find(r=>r.id===S.sel);
  const tile=r=>{const[s,c]=rst(r);return `<div class="tile ${r.id===S.sel?'sel':''}" data-a="sel" data-id="${r.id}"><div class="scr">${r.online?`<img data-f="${r.id}" alt="Live screen of ${esc(r.id)}" ${S.frames[r.id]?`src="data:image/jpeg;base64,${S.frames[r.id]}"`:''}>`:'No signal'}</div>
   <div class="tt"><b>${esc(r.id)}</b><span class="pill ${c}">${s}</span></div>${r.session?`<div class="tl"><b title="${esc(r.session.lecture)}">${esc(r.session.lecture)}</b><span>${r.session.total?r.session.slide+' / '+r.session.total:(KL[r.session.kind]||'File')}</span></div>${r.session.total?`<div class="prog t"><i style="width:${Math.round(r.session.slide/r.session.total*100)}%"></i></div>`:''}`:''}<div class="tf"><span>${r.faculty?esc(r.faculty.name):'No one signed in'}</span>${r.online?`<label data-a="stop-prop"><input type="checkbox" data-a="pick" data-id="${r.id}" ${S.picked.has(r.id)?'checked':''}> Select</label>`:''}</div></div>`};
  const opts=v=>S.lects.map(l=>`<option value="${l.id}" ${l.id===v?'selected':''}>${esc(l.title)} · ${esc(l.by)}</option>`).join(''),lo=opts(S.bsel),lo2=opts(S.lsel);

  `<div class="card facts"><div><b>${R.length}</b><span>Lecture rooms</span></div><div><b>${R.filter(r=>r.online).length}</b><span>Online</span></div><div><b>${R.filter(r=>r.faculty).length}</b><span>Faculty signed in</span></div><div><b>${R.filter(r=>r.session).length}</b><span>Presenting</span></div><div><b>${R.filter(r=>r.assist).length}</b><span>Need help</span></div></div>
  <div class="mon"><section><div class="chips">${[['all','All'],['online','Online'],['offline','Offline'],['help','Needs help']].map(([k,l])=>`<button class="chip ${S.flt===k?'on':''}" data-a="flt" data-k="${k}">${l}</button>`).join('')}</div>
  ${floors.map(n=>`<div class="fl">${esc(n)}</div><div class="grid">${V.filter(r=>r.floor===n).map(tile).join('')}</div>`).join('')||`<div class="card empty" style="margin-top:12px"><b>No lecture rooms to show</b>${R.length?'Try another filter.':'Add a lecture room under Lecture rooms.'}</div>`}</section>
  <aside class="det">${S.picked.size?`<div class="card p bulk"><b>${S.picked.size} room${S.picked.size>1?'s':''} selected</b><div class="inline" style="margin-top:10px"><select data-c="bsel" aria-label="Lecture">${lo}</select></div><div class="acts" style="justify-content:flex-start;margin-top:10px"><button class="btn pri s" data-a="bulk" data-c="open">Present to all</button><button class="btn s" data-a="bulk" data-c="blank">Blank</button><button class="btn s" data-a="bulk" data-c="stop">Stop</button><button class="btn s" data-a="bulk" data-c="clear-sel">Clear</button></div></div>`:''}${x?detail(x,lo2):'<div class="card empty"><b>Select a lecture room</b>Its live screen and controls appear here.</div>'}</aside></div>`;
}

  <div class="sec">Recent activity</div>${(x.events&&x.events.length)?`<ul class="feed">${x.events.slice().reverse().slice(0,8).map(e=>`<li><time>${new Date(e.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</time><span><b>${esc(e.who)}</b> · ${esc(e.text)}</span></li>`).join('')}</ul>`:'<p class="mu sm">Nothing yet today.</p>'}</div>`}

const CAT={display:'Projector or display',sound:'Sound or microphone',pc:'PC or software',slides:'Slides will not open',other:'Something else'};
const thread=t=>t.comments&&t.comments.length?`<div class="thread">${t.comments.map(c=>`<div class="cm ${c.role==='teacher'?'':'av'}"><b>${esc(c.by)}</b><span class="mu sm"> · ${ago(c.at)}${c.role==='teacher'?'':' · AV'}</span><p>${esc(c.text)}</p></div>`).join('')}</div>`:'';
function avCard(r){
  const t=S.help[0],show=t&&(t.status==='open'||Date.now()-(t.resolvedAt||0)<2*3600e3);
  let body;
  if(!show)body=`<div class="inline" style="align-items:center"><div class="sm mu" style="flex:1 1 200px">Projector, sound or PC not working?</div><button class="btn s" data-a="helpNew" ${r.online?'':'disabled'}>${ic('bell')}Request AV help</button></div>`;
  else if(t.status==='open')body=`<div class="th"><span class="pill help">AV help requested</span><span class="grow"></span><span class="meta">${ago(t.at)}</span></div><p class="msg"><b>${CAT[t.category]}</b>${t.message?' · '+esc(t.message):''}</p>${thread(t)}<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn s" data-a="helpNote" data-id="${t.id}">Add a note</button></div>`;
  else body=`<div class="th"><span class="pill live">Resolved</span><span class="grow"></span><span class="meta">${esc(t.resolvedBy||'AV staff')} · ${ago(t.resolvedAt)}</span></div><p class="msg"><b>${CAT[t.category]}</b></p>${thread(t)}<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn s" data-a="helpNew">${ic('bell')}Request AV help again</button></div>`;
  return `<section class="card p hlp" aria-label="AV help">${body}</section>`;
}
function helpTab(){
  const L=S.help,open=L.filter(t=>t.status==='open'),list=S.hf==='open'?open:S.hf==='resolved'?L.filter(t=>t.status==='resolved'):L;
  const card=t=>`<article class="card ticket ${t.status}"><div class="th"><span class="plate s ${t.status==='open'?'':'done'}"><i></i>${esc(t.room)}</span><span class="pill ${t.status==='open'?'help':'live'}">${t.status==='open'?'Open':'Resolved'}</span><b>${CAT[t.category]}</b><span class="grow"></span><span class="meta">#${t.id} · ${ago(t.at)}</span></div>
  <p class="msg">${t.message?esc(t.message):'<span class="mu">No details given.</span>'}</p><div class="meta">${esc(t.name)}${t.floor?' · '+esc(t.floor):''} · ${fdate(t.at)}${t.mail?' · '+esc(t.mail):''}</div>${thread(t)}
  ${t.status==='open'?`<div class="reply"><input name="cm${t.id}" placeholder="Add a comment for the faculty member" maxlength="1000" data-c="draft" data-id="${t.id}" aria-label="Comment"><button class="btn" data-a="hcomment" data-id="${t.id}" id="cb${t.id}">Add comment</button><button class="btn pri" data-a="hresolve" data-id="${t.id}">${ic('check')}Resolve</button></div>`

  (list.map(card).join('')||`<div class="card empty"><b>${S.hf==='open'?'No open requests':'Nothing here yet'}</b>${S.hf==='open'?'New requests from lecture rooms appear here and are emailed to AV staff.':''}</div>`);

function sessionsTab(){
  return head('Sign-ins','Who is signed in, and where. A faculty login belongs to one lecture room at a time.',`<button class="btn" data-a="refresh">Refresh</button>`)+
  `<section class="card"><div class="tw"><table><tr><th>Person</th><th>Role</th><th>Lecture room</th><th>Since</th><th>Last active</th><th>Status</th><th></th></tr>${S.sess.map(s=>`<tr><td><b>${esc(s.name)}</b><div class="mu sm">${esc(s.user)}</div></td><td>${ROLE[s.role]}</td><td>${s.room?esc(s.room)+'<div class="mu sm">'+esc(s.ip)+(s.remote?' · own device':'')+'</div>':s.remote?'<span class="mu">Choosing a room · '+esc(s.ip)+'</span>':'<span class="mu">Any device</span>'}</td><td>${fdate(s.since)}</td><td>${ago(s.last)}</td><td><span class="pill ${s.presenting?'live':s.online?'ready':'off'}">${s.presenting?'Presenting':s.online?'Active':'Page closed'}</span></td>
  <td class="r">${s.sid===S.me.sid?'':`<button class="btn s dng" data-a="release" data-id="${s.sid}">Release</button>`}</td></tr>`).join('')||'<tr><td colspan="7"><div class="empty"><b>No one is signed in</b></div></td></tr>'}</table></div></section>`}

function logsTab(){
  const q=S.lq.toLowerCase(),L=S.logs.filter(l=>!q||(l.u+' '+l.m).toLowerCase().includes(q));
  return head('Activity log','Sign-ins, uploads, presentation commands and room connections.',`<div class="acts"><button class="btn" data-a="logs">Refresh</button><button class="btn" data-a="dlLog">${ic('down')}Download full log</button></div>`)+
  `<section class="card"><header><input id="lq" placeholder="Search the log" value="${esc(S.lq)}" data-c="lq" style="max-width:320px"><span class="mu sm">${L.length} entries${L.length>200?', showing 200':''}</span></header><div class="tw"><table><tr><th>Time</th><th>User</th><th>Activity</th></tr>${L.slice(0,200).map(l=>`<tr><td style="white-space:nowrap">${l.t?fdate(l.t):''}</td><td>${esc(l.u)}</td><td>${esc(l.m)}</td></tr>`).join('')||'<tr><td colspan="3"><div class="empty"><b>No entries</b></div></td></tr>'}</table></div></section>`}

function usersTab(){
  return head('Users','Faculty can sign in on a lecture room PC, or from their own phone or laptop and choose a room.')+
  `<div class="stack"><section class="card p"><h3>Create an account</h3><p class="mu" style="margin:4px 0 0">The person must choose a new password the first time they sign in.</p>
  <form data-submit="addUser" class="inline" style="margin-top:14px"><label class="fld" style="margin:0"><span>Username or email</span><input name="user" required autocomplete="off" placeholder="name@college.edu"></label><label class="fld" style="margin:0"><span>Full name</span><input name="name" placeholder="Dr. Ahmed" autocomplete="off"></label><label class="fld" style="margin:0"><span>Temporary password</span><input name="pass" type="password" required autocomplete="new-password"></label>
  <label class="fld" style="margin:0"><span>Role</span><select name="role"><option value="teacher">Faculty</option><option value="av">AV operator</option><option value="admin">Administrator</option></select></label><button class="btn pri">Create account</button></form></section>
  <section class="card"><header><h3>Accounts</h3><span class="mu sm">${S.users.length}</span></header><div class="tw"><table><tr><th>Username</th><th>Name</th><th>Role</th><th>Signed in at</th><th></th></tr>${S.users.map(u=>`<tr><td><b>${esc(u.user)}</b>${u.mustChange?' <span class="pill help">Temporary password</span>':''}</td><td>${esc(u.name)}</td><td>${ROLE[u.role]}</td><td>${u.room?esc(u.room):'<span class="mu">—</span>'}</td><td class="r"><div class="acts"><button class="btn s" data-a="resetPw" data-id="${esc(u.user)}">Reset password</button><button class="btn s dng" data-a="delUser" data-id="${esc(u.user)}">Remove</button></div></td></tr>`).join('')}</table></div></section></div>`}

/* ---------- actions ---------- */
async function uploadFiles(files,present=false){
  const ok=[],ids=[];
  for(const f of files){
    const why=fileProblem(f);if(why){toast(`${f.name}: ${why}`,'err');continue}
    toast(`Uploading ${f.name}…`);
    try{const r=await fetch('/api/lectures',{method:'POST',headers:{authorization:'Bearer '+S.tok,'x-filename':encodeURIComponent(f.name)},body:f});const d=await r.json();
      if(r.status===401)return signedOut('Your sign-in ended. Please sign in again.');if(!r.ok)toast(d.error||'Upload failed','err');else{ok.push(f.name);ids.push(d.id)}}catch{toast(`${f.name}: upload failed. Check the network connection and the file size.`,'err')}
  }
  if(ok.length){await loadLects();
    if(present){S.starting=Date.now();cmd('open',null,{lecture:ids[ids.length-1]});paint();setTimeout(()=>{if(S.tok)paint()},20500)}
    else toast(ok.length===1?`${ok[0]} uploaded`:`${ok.length} lectures uploaded`,'ok')}
}
const canPresentNow=()=>{const r=S.rooms[0];return !staff()&&!!r&&r.online&&!r.session&&(!r.owner||r.owner.user===S.me.user)};
const A={
  theme:toggleTheme,logout:doLogout,pw:()=>changePassword(false),
  fs:()=>enterFs(),fsx:()=>exitFs(),
  fsPresent:()=>{const l=S.fsel||(S.lects[0]&&S.lects[0].id);if(!l)return toast('Upload a lecture first.','err');A.open({dataset:{id:l}})},
  key:b=>cmd('key',null,{k:b.dataset.k}),
  pickRoom:async b=>{b.disabled=true;const d=await api('/api/remote/room',{method:'POST',body:JSON.stringify({room:b.dataset.id})});if(d.ok){S.me.room=d.room;toast('Connected to '+d.room+'. Your slides will open there only.','ok')}else b.disabled=false},
  leaveRoom:async()=>{const d=await api('/api/remote/leave',{method:'POST',body:'{}'});if(d.ok)S.me.room=null},
  hf:b=>{S.hf=b.dataset.k;paint()},
  helpNew:async()=>{const v=await ask({title:'Request AV help',text:'AV staff are notified at once and are also emailed.',fields:[{name:'category',label:'What is the problem?',type:'select',options:Object.entries(CAT)},{name:'message',label:'Details (optional)',type:'textarea',ph:'e.g. The projector shows no signal'}],ok:'Send request',submit:async v=>{const r=await fetch('/api/help',{method:'POST',headers:{authorization:'Bearer '+S.tok,'content-type':'application/json'},body:JSON.stringify(v)});const d=await r.json().catch(()=>({}));return r.ok?null:d.error||'Could not send the request.'}});if(v)toast('AV staff have been notified','ok')},
  helpNote:async b=>{const v=await ask({title:'Add a note',fields:[{name:'text',label:'Note for AV staff',type:'textarea',max:1000}],ok:'Send note',submit:async v=>{const r=await fetch('/api/help/'+b.dataset.id+'/comments',{method:'POST',headers:{authorization:'Bearer '+S.tok,'content-type':'application/json'},body:JSON.stringify(v)});const d=await r.json().catch(()=>({}));return r.ok?null:d.error}});if(v)toast('Note sent','ok')},
  hcomment:async b=>{const i=document.querySelector(`[name="cm${b.dataset.id}"]`),text=i&&i.value.trim();if(!text)return toast('Write a comment first.','err');const d=await api('/api/help/'+b.dataset.id+'/comments',{method:'POST',body:JSON.stringify({text})});if(d.ok){const j=document.querySelector(`[name="cm${b.dataset.id}"]`);if(j)j.value='';toast('Comment added','ok')}},
  hresolve:async b=>{const i=document.querySelector(`[name="cm${b.dataset.id}"]`),draft=i?i.value.trim():'';const v=await ask({title:'Resolve this request?',text:'The faculty member is told it is resolved.',fields:[{name:'note',label:'Note for the faculty member (optional)',type:'textarea',max:1000}],ok:'Mark as resolved',submit:async v=>{const r=await fetch('/api/help/'+b.dataset.id+'/resolve',{method:'POST',headers:{authorization:'Bearer '+S.tok,'content-type':'application/json'},body:JSON.stringify({note:v.note||draft})});const d=await r.json().catch(()=>({}));return r.ok?null:d.error}});if(v)toast('Request resolved','ok')},
  hreopen:async b=>{const d=await api('/api/help/'+b.dataset.id+'/reopen',{method:'POST',body:'{}'});if(d.ok){toast('Request reopened','ok');S.hf='open'}},
  logoDel:async()=>{const d=await api('/api/settings/logo',{method:'DELETE'});if(d.ok){await loadBrand();toast('Logo removed','ok');render()}},
  testMail:async b=>{const f=document.querySelector('[data-submit=saveMail]');if(!await saveMail(f))return;b.disabled=true;const r=await fetch('/api/settings/mail/test',{method:'POST',headers:{authorization:'Bearer '+S.tok}});const d=await r.json().catch(()=>({}));b.disabled=false;r.ok?toast('Test email sent to '+d.to,'ok'):toast(d.error||'Could not send the test email.','err')},

  go:async b=>{S.tab=b.dataset.t;if(S.tab==='logs')await A.logs();if(S.tab==='users')await loadUsers();if(S.tab==='sessions')await A.refresh();if(S.tab==='lectures')await loadLects();if(S.tab==='settings')await loadMail();render()},
  flt:b=>{S.flt=b.dataset.k;paint()},sel:b=>{S.sel=b.dataset.id;S.selOff=0;paint()},closeDet:()=>{S.sel=null;S.selOff=1;paint()},
  'stop-prop':()=>{},
  pick:b=>{b.checked?S.picked.add(b.dataset.id):S.picked.delete(b.dataset.id);paint()},
  open:b=>{S.starting=Date.now();cmd('open',null,{lecture:b.dataset.id,full:!!S.fs});paint();setTimeout(()=>{if(S.tok)paint()},20500)},
  'open-staff':()=>{const l=S.lsel||(S.lects[0]&&S.lects[0].id);if(!l)return toast('Upload a lecture first.','err');cmd('open',S.sel,{lecture:l})},
  rcOpen:b=>rcOpen(b.dataset.id),rcClose:()=>rcClose(),rcRelease:b=>cmd('release',b.dataset.id),
  rcFull:()=>{const el=$('rc');if(!el)return;try{document.fullscreenElement?document.exitFullscreen():(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch{}},
  ctl:b=>{const c=b.dataset.c;if(!staff()&&(c==='next'||c==='prev'))optNav(c==='next'?1:-1);cmd(c,S.sel)},
  bulk:b=>{const c=b.dataset.c;if(c==='clear-sel'){S.picked.clear();return paint()}const l=S.bsel||(S.lects[0]&&S.lects[0].id);if(c==='open'&&!l)return toast('Upload a lecture first.','err');S.picked.forEach(r=>cmd(c,r,{lecture:l}))},
  delLect:async b=>{const l=S.lects.find(x=>x.id===b.dataset.id);if(!await confirmBox('Delete this lecture?',`"${l?l.title:''}" will be removed permanently.`,'Delete'))return;const d=await api('/api/lectures/'+b.dataset.id,{method:'DELETE'});if(d.ok){toast('Lecture deleted','ok');loadLects()}},
  delRoom:async b=>{if(!await confirmBox('Remove '+b.dataset.id+'?','Faculty will no longer be able to sign in on this PC, and any current sign-in ends.','Remove room'))return;const d=await api('/api/rooms/'+b.dataset.id,{method:'DELETE'});if(d.ok)toast('Room removed','ok')},
  editRoom:async b=>{const r=S.rooms.find(x=>x.id===b.dataset.id);const v=await ask({title:'Edit '+r.id,fields:[{name:'floor',label:'Floor',value:r.floor}],ok:'Save changes',submit:async v=>{const d=await fetch('/api/rooms/'+r.id,{method:'PUT',headers:{authorization:'Bearer '+S.tok,'content-type':'application/json'},body:JSON.stringify(v)}).then(x=>x.json());return d.error||null}});if(v)toast('Room updated','ok')},
  copyId:b=>{const t=b.dataset.id,ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch{}ta.remove();toast(ok?'Agent ID copied':'Copy it by hand: '+t,ok?'ok':'')},
  newKey:async b=>{if(!await confirmBox('Create a new Agent ID for '+b.dataset.id+'?','The agent on that PC disconnects until you run its new installer.','Create new ID'))return;const d=await api('/api/rooms/'+b.dataset.id+'/rekey',{method:'POST',body:'{}'});if(d.ok)toast('New Agent ID created. Download and run the installer on that PC again.','ok')},
  vncInstaller:async b=>{const r=await fetch('/api/vnc-installer?room='+b.dataset.id,{headers:{authorization:'Bearer '+S.tok}});if(!r.ok){let m='Not allowed';try{m=(await r.json()).error||m}catch{}return toast(m,'err')}const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='install-vnc-'+b.dataset.id+'.bat';a.click();toast('VNC installer downloaded. Run it on that PC as administrator.','ok')},
  installer:async b=>{const r=await fetch('/api/installer?room='+b.dataset.id,{headers:{authorization:'Bearer '+S.tok}});if(!r.ok)return toast('Not allowed','err');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='install-agent-'+b.dataset.id+'.bat';a.click();toast('Installer downloaded','ok')},
  release:async b=>{if(!await confirmBox('Release this sign-in?','The person is signed out at once, and any lecture they are presenting ends.','Release sign-in'))return;const d=await api('/api/sessions/'+b.dataset.id,{method:'DELETE'});if(d.ok){toast('Sign-in released','ok');A.refresh().then(paint)}},
  releaseRoom:async b=>{const r=S.rooms.find(x=>x.id===b.dataset.id);if(!await confirmBox('Release '+(r&&r.faculty?r.faculty.name:'faculty')+'?','They are signed out of '+b.dataset.id+' and their lecture ends.','Release sign-in'))return;const list=await api('/api/sessions');const s=Array.isArray(list)&&list.find(x=>x.room===b.dataset.id);if(!s)return;const d=await api('/api/sessions/'+s.sid,{method:'DELETE'});if(d.ok)toast('Sign-in released','ok')},
  refresh:async()=>{const d=await api('/api/sessions');if(Array.isArray(d))S.sess=d;if(S.tab==='sessions')paint()},
  logs:async()=>{const d=await api('/api/logs');if(Array.isArray(d))S.logs=d;if(S.tab==='logs')paint()},
  dlLog:async()=>{const r=await fetch('/api/logs?download=1',{headers:{authorization:'Bearer '+S.tok}});const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='audit-log.txt';a.click()},
  resetPw:async b=>{const v=await ask({title:'Reset password for '+b.dataset.id,text:'They will be signed out and must choose a new password at their next sign-in.',fields:[{name:'pass',label:'Temporary password (8+ characters)',type:'password',ac:'new-password'}],ok:'Reset password',submit:async v=>{const d=await fetch('/api/users/'+encodeURIComponent(b.dataset.id)+'/password',{method:'PUT',headers:{authorization:'Bearer '+S.tok,'content-type':'application/json'},body:JSON.stringify(v)}).then(x=>x.json());return d.error||null}});if(v){toast('Password reset','ok');loadUsers().then(paint)}},
  delUser:async b=>{if(!await confirmBox('Remove '+b.dataset.id+'?','The account is deleted and any current sign-in ends.','Remove account'))return;const d=await api('/api/users/'+encodeURIComponent(b.dataset.id),{method:'DELETE'});if(d.ok){toast('Account removed','ok');loadUsers().then(paint)}},
};
async function loadMail(){const d=await api('/api/settings/mail');if(d&&!d.error)S.mail=d}
async function saveMail(f){const v=Object.fromEntries(new FormData(f));const d=await api('/api/settings/mail',{method:'PUT',body:JSON.stringify({...v,secure:!!v.secure,insecureTls:!!v.insecureTls})});if(d.ok){await loadMail();return true}return false}
async function loadUsers(){const d=await api('/api/users');if(Array.isArray(d))S.users=d}
const SUBMIT={
  async saveName(f){const d=await api('/api/settings/name',{method:'PUT',body:JSON.stringify({name:f.name.value})});if(d.ok){await loadBrand();toast('System name saved','ok');render()}},
  async saveMail(f){if(await saveMail(f)){toast('Settings saved','ok');f.pass.value='';paint()}},
  async addRoom(f){const id=f.id.value.trim(),d=await api('/api/rooms',{method:'POST',body:JSON.stringify({id,floor:f.floor.value.trim()||'Ground'})});if(d.ok){f.reset();const v=await ask({title:id+' added',text:'Agent ID: '+d.agentId+'. Download the installer and run it on the lecture room PC.',ok:'Download installer',danger:false});if(v)A.installer({dataset:{id}})}},
  async addUser(f){const d=await api('/api/users',{method:'POST',body:JSON.stringify({user:f.user.value.trim(),name:f.name.value.trim(),pass:f.pass.value,role:f.role.value})});if(d.ok){toast('Account created','ok');f.reset();await loadUsers();paint()}},
};

/* ---------- events ---------- */
Object.assign(A,{
  rcMore:()=>{S.rc.more=!S.rc.more;if(!S.rc.more){S.rc.pres=false;S.rc.keys=false}rcBar()},
  rcPres:()=>{S.rc.pres=!S.rc.pres;rcBar()},
  rcKeys:()=>{S.rc.keys=!S.rc.keys;rcBar()},
  rcTxt:()=>{S.rc.txt=!S.rc.txt;rcBar();const t=$('rctext');t&&t.focus()},
  rcSendTxt:()=>{const t=$('rctext');if(t&&t.value){S.rc.vnc?vncType(t.value):rcText(t.value);t.value=''}},
  vncCad:()=>{S.rc.rfb&&S.rc.rfb.sendCtrlAltDel()},
  vncKey:b=>{S.rc.rfb&&S.rc.rfb.sendKey(+b.dataset.k,null);S.rc.rfb&&S.rc.rfb.focus()},
  rcKb:()=>{const k=$('rckb');if(!k)return;if(document.activeElement===k)k.blur();else k.focus({preventScroll:true})},
  rcDrag:()=>{S.rc.drag=!S.rc.drag;rcBar();toast(S.rc.drag?'Drag mode on: on a touch screen one finger now drags.':'Drag mode off.')},
  rcDbl:()=>{rcSend({k:'dbl',...(S.rc.mv||{x:.5,y:.5})})},
  rcMod:b=>{const m=S.rc.mod,x=b.dataset.m;m.has(x)?m.delete(x):m.add(x);rcBar()},
  rcVKey:b=>rcKey(b.dataset.k),
  rcCombo:b=>rcTap(RC_COMBOS[+b.dataset.i][1]),
  rcCmd:b=>cmd(b.dataset.c,S.rc.room),
  rcEnd:async()=>{if(await confirmBox('End the lecture?','The lecture closes on the room PC. Remote control stays on.','End lecture'))cmd('stop',S.rc.room)},
  rcPresent:()=>{const l=S.fsel||(S.lects[0]&&S.lects[0].id);if(!l)return toast('Upload a lecture first.','err');S.starting=Date.now();cmd('open',S.rc.room,{lecture:l,full:true})},
  xfOpen:b=>xfOpen(b.dataset.id),xfClose:()=>xfClose(),
  xfOpenFile:b=>{const x=S.xf,f=x&&x.files&&x.files[+b.dataset.i];if(f)cmd('xopen',x.room,{folder:x.folder,name:f.name})},
});
document.addEventListener('change',async e=>{
  const t=e.target;if(!t||t.id!=='logoin'||!t.files||!t.files[0])return;
  const f=t.files[0];t.value='';
  if(!/^image\/(png|jpeg|webp)$/.test(f.type)||f.size>2*1024*1024)return toast('Choose a PNG, JPG or WebP picture of at most 2 MB.','err');
  const d=await api('/api/settings/logo',{method:'PUT',headers:{'content-type':f.type},body:f});
  if(d.ok){await loadBrand();toast('Logo saved','ok');render()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='xfin'){xfSend([...t.files]);t.value=''}
  else if(t.dataset.c==='xffolder'&&S.xf){S.xf.folder=t.value;xfDraw();xfList()}
  else if(t.dataset.c==='rcmon'&&S.rc){S.rc.mon=+t.value;cmd('mon',S.rc.room,{n:+t.value})}
  else if(t.dataset.c==='rcgoto'&&S.rc){cmd('goto',S.rc.room,{n:+t.value});t.blur()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  if(b.dataset.a==='stop-prop'){e.stopPropagation();return}
  if(b.dataset.a==='pick'){e.stopPropagation();A.pick(b);return}
  if(b.matches('label.drop,[data-a="drop"]'))return;
  const f=A[b.dataset.a];if(f){e.preventDefault();f(b)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='upf'){uploadFiles([...t.files],canPresentNow());t.value=''}
  if(t.dataset.c==='gotosel'){const r=S.rooms[0];if(r){optTo(+t.value,r.id);cmd('goto',null,{n:+t.value})}t.blur();return}
  if(t.dataset.c==='fsel')S.fsel=t.value;if(t.dataset.c==='lsel')S.lsel=t.value;if(t.dataset.c==='bsel')S.bsel=t.value;
});
document.addEventListener('input',e=>{if(e.target.dataset.c==='lq'){S.lq=e.target.value;const el=e.target,p=el.selectionStart;paint();const n=$('lq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.c==='draft'){e.preventDefault();const b=$('cb'+e.target.dataset.id);b&&b.click()}});
document.addEventListener('submit',e=>{const n=e.target.dataset.submit;if(n&&SUBMIT[n]){e.preventDefault();SUBMIT[n](e.target)}});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}}));
['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){d.classList.remove('over');if(ev==='drop'){e.preventDefault();uploadFiles([...e.dataTransfer.files],canPresentNow())}}}));
document.addEventListener('keydown',e=>{
  if(S.rc)return;
  if(!S.tok||!S.me||e.target.closest('input,select,textarea,.modal')||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(!staff()){if(k==='Escape'&&S.fs){exitFs();return}if(k==='f'||k==='F'){e.preventDefault();S.fs?exitFs():enterFs();return}}
  const r=staff()?(S.tab==='monitor'&&S.rooms.find(x=>x.id===S.sel)):S.rooms[0];if(!r||!r.session)return;
  if(!r.session.total){
    if(k===' '&&isMedia(r)){e.preventDefault();cmd('playpause',staff()?S.sel:null);return}
    const KM={ArrowRight:'right',ArrowLeft:'left',ArrowUp:'up',ArrowDown:'down',PageUp:'pgup',PageDown:'pgdn',Home:'home',End:'end',' ':'space'};
    if(!staff()&&S.fs&&KM[k]){e.preventDefault();cmd('key',null,{k:KM[k]})}
    return}
  if(k==='ArrowRight'||k==='PageDown'||k===' '||(k==='ArrowDown'&&S.fs&&!staff())){e.preventDefault();if(!staff())optNav(1);cmd('next',staff()?S.sel:null)}
  else if(k==='ArrowLeft'||k==='PageUp'||(k==='ArrowUp'&&S.fs&&!staff())){e.preventDefault();if(!staff())optNav(-1);cmd('prev',staff()?S.sel:null)}
  else if(k==='b'||k==='B'){cmd('blank',staff()?S.sel:null)}
});
setInterval(()=>{if(S.tok&&staff()&&S.tab==='sessions')A.refresh()},10000);
start();
</script>
